<!DOCTYPE html>
<html>
<head>
    <title>WPT OWNER DASHBOARD</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
        .stat-card { background: #111; padding: 15px; border-radius: 10px; border-left: 5px solid #ff00ff; margin-bottom: 10px; }
        .gold { color: #bf953f; }
        .burn { color: #ff4d4d; }
    </style>
</head>
<body>
    <h1>🛰️ WPT COMMAND CENTER</h1>
   <div class="stat-card" style="border-left-color: #00ecff; background: #1a1a1a;">
    <h3>📢 BROADCAST SYSTEM</h3>
    <textarea id="broadcast-msg" placeholder="Type your message here..." 
              style="width: 100%; height: 80px; background: #000; color: #00ecff; border: 1px solid #333; border-radius: 5px; padding: 10px;"></textarea>
    <br><br>
    <button onclick="sendBroadcast()" id="btn-send"
            style="background: #00ecff; color: #000; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer;">
        SEND TO ALL USERS 🚀
    </button>
    <p id="broadcast-status" style="font-size: 12px; margin-top: 10px;"></p>
</div>

<script>
    async function sendBroadcast() {
        const msg = document.getElementById('broadcast-msg').value;
        if(!msg) return alert("Please type a message!");
        
        if(!confirm("Are you sure? This will send a notification to EVERYONE.")) return;
        
        const btn = document.getElementById('btn-send');
        const status = document.getElementById('broadcast-status');
        
        btn.disabled = true;
        status.innerText = "Sending... Please wait.";
        
        try {
            const r = await fetch(`/api/admin/broadcast/${ADMIN_ID}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });
            const res = await r.json();
            
            if(res.ok) {
                status.style.color = "#00ff00";
                status.innerText = `✅ Success! Message sent to ${res.sent} users.`;
                document.getElementById('broadcast-msg').value = "";
            } else {
                throw new Error(res.error);
            }
        } catch (e) {
            status.style.color = "#ff4d4d";
            status.innerText = "❌ Error: " + e.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
