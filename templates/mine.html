{% extends "base.html" %}

{% block content %}
<div id="p-mine" class="page active-page">
    <div class="prof-header" style="background: linear-gradient(180deg, rgba(255,204,0,0.05) 0%, transparent 100%);">
        <small id="prof-rank" style="color:var(--gold); font-weight:900; letter-spacing: 1px;">RANK: #---</small>
        <h1 id="tot" style="font-size:48px; margin:5px 0; font-family: 'monospace'; font-weight: 800; text-shadow: 0 0 15px rgba(255,255,255,0.1);">0.00</h1>
        
        <div style="padding: 0 20px;">
            <div style="background:#1a1a1c; height:10px; border-radius:10px; margin:10px 0; border: 1px solid #333; overflow: hidden; position: relative;">
                <div id="e-f" style="background: linear-gradient(90deg, var(--gold), #ffaa00); height:100%; width:0%; transition:0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67); position: relative;">
                    <div style="position:absolute; top:0; left:0; right:0; bottom:0; background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 100%);"></div>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <small id="e-t" style="color:var(--text); font-weight: bold; font-size: 11px; opacity: 0.8;">Energy: 0/100</small>
                <div style="display: flex; gap: 5px; align-items: center;">
                    <span id="turbo-status" style="display:none; background:#A259FF; color:white; font-size:9px; padding:2px 6px; border-radius:10px; font-weight:900; animation: pulse 1.5s infinite;">⚡ TURBO</span>
                    <span id="boost-badge" style="display:none; background: linear-gradient(90deg, #00ecff, #0044ff); color: white; font-size: 9px; padding: 2px 8px; border-radius: 10px; font-weight: 900;">🚀 x<span id="mining-multiplier">1.0</span></span>
                </div>
                <small style="color:var(--gold); font-size: 10px; font-weight: 900;">⚡ AUTO</small>
            </div>
        </div>
    </div>

    <div id="burn-stats-header" style="text-align: center; margin-top: -10px; margin-bottom: 20px; opacity: 0.9;">
        <span style="background: rgba(235, 64, 52, 0.1); color: #eb4034; padding: 5px 15px; border-radius: 20px; font-size: 11px; font-weight: 800; border: 1px solid rgba(235, 64, 52, 0.2);">
            🔥 TOTAL BURNED: <span id="global-burned-val">0.00</span> WPT
        </span>
    </div>

    <div style="display: grid; gap: 10px; margin-top: 10px;">
        <div class="card" style="margin-bottom: 0; padding: 12px 18px;">
            <div><b>Genesis <span style="color:var(--gold)">(WPT)</span></b><br><small id="gv">0.00</small></div>
            <button class="btn" onclick="mine('genesis', event)">MINE</button>
        </div>
        <div class="card" style="margin-bottom: 0; padding: 12px 18px;">
            <div><b>Unity Pool</b><br><small id="uv">0.00</small></div>
            <button class="btn" style="background: #eee;" onclick="mine('unity', event)">SYNC</button>
        </div>
        <div class="card" style="margin-bottom: 0; padding: 12px 18px; border-color: rgba(162, 89, 255, 0.3);">
            <div><b style="color:var(--purple);">Veo AI</b><br><small id="vv">0.00</small></div>
            <button class="btn" style="background:var(--purple); color:#fff;" onclick="mine('veo', event)">COMPUTE</button>
        </div>
    </div>

    <div class="coin-container" style="text-align:center; margin-top:35px; position: relative;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 140px; background: var(--gold); filter: blur(40px); opacity: 0.15; border-radius: 50%; pointer-events: none;"></div>
        <img src="/static/genesis.png" class="main-coin" style="width:170px; height: 170px; cursor:pointer;" onclick="mine('genesis', event)">
    </div>
</div>

<div id="p-launcher" class="page" style="display:none;">
    <h2 style="text-align:center; font-weight: 800; color: #fff;">🚀 LAUNCHPAD</h2>
    <div style="padding: 10px; margin-bottom: 10px;">
        <div style="position: relative;">
            <span style="position: absolute; left: 12px; top: 12px; opacity: 0.5;">🔍</span>
            <input type="text" id="token-search" oninput="loadMarket()" placeholder="Search tokens..." style="width: 100%; padding: 12px 12px 12px 40px; border-radius: 15px; border: 1px solid #333; background: rgba(255,255,255,0.03); color: white;">
        </div>
    </div>

    <div class="card" style="flex-direction:column; align-items:stretch; gap:12px; background: #121214; padding:20px;">
        <input type="text" id="tk-name" class="l-input" placeholder="Name">
        <input type="text" id="tk-sym" class="l-input" placeholder="$SYM">
        <button class="btn" style="background:var(--gold); color:#000; width:100%; font-weight:900;" onclick="deployToken()">LAUNCH TOKEN</button>
    </div>

    <div style="display: flex; gap: 10px; margin: 20px 0 15px 0;">
        <div onclick="setFilter('new', this)" class="tab-btn active-tab">✨ New</div>
        <div onclick="setFilter('hot', this)" class="tab-btn">🔥 Hot</div>
    </div>
    <div id="token-list"></div>
</div>

<div id="p-wallet" class="page" style="display:none;">
    <h2 style="text-align:center;">💼 WALLET</h2>
    <div class="card" style="text-align:center; padding:30px; flex-direction:column;">
        <h1 id="wallet-balance">0.00</h1>
        <div id="ton-connect-button"></div>
    </div>
</div>

<div id="p-profil" class="page" style="display:none;">
    <div class="prof-header" style="text-align:center;">
        <div id="prof-initials" style="width:70px; height:70px; background:var(--gold); border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center; color:#000; font-weight:900;">U</div>
        <h2 id="prof-name">USER</h2>
        <h1 id="usd-val" style="color:var(--green);">$0.00</h1>
    </div>
    <div id="user-portfolio"></div>
    <div id="leaderboard"></div>
</div>

<div id="p-lottery" class="page" style="display:none;">
    <h2 style="text-align:center; color:var(--gold);">🎰 JACKPOT</h2>
    <div style="background:#111; padding:30px; border-radius:20px; text-align:center;">
        <h1 id="jackpot-amount">0</h1>
        <button class="btn" onclick="buyLotteryTicket()">BUY TICKET</button>
    </div>
</div>

<div id="trade-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10000; align-items:center; justify-content:center;">
    <div style="background:#111; padding:25px; border-radius:20px; width:80%; text-align:center;">
        <h2 id="modal-title">TRADE</h2>
        <input type="number" id="trade-amount" style="width:100%; padding:15px; margin:20px 0;">
        <div style="display:flex; gap:10px;">
            <button onclick="closeTrade()" style="flex:1;">Cancel</button>
            <button onclick="executeTrade()" style="flex:1; background:var(--gold);">Confirm</button>
        </div>
    </div>
</div>

{% endblock %}
