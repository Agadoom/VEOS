<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One World Peace Coins</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold: #FFD700;
            --purple: #A259FF;
            --bg: #000000;
            --card-bg: #0a0a0b;
            --text: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-user-select: none;
        }

        /* --- STYLES GENERAUX --- */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .active-page { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #1a1a1c;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn {
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }

        .l-input {
            background: #111;
            border: 1px solid #333;
            color: white;
            padding: 10px;
            border-radius: 10px;
            outline: none;
        }

        /* --- NAVIGATION BASSE --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: rgba(10, 10, 11, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #1a1a1c;
            z-index: 1000;
        }

        .nav-item {
            text-align: center;
            opacity: 0.5;
            transition: 0.3s;
            cursor: pointer;
        }
        .nav-item.active {
            opacity: 1;
            color: var(--gold);
        }
        .nav-item span { font-size: 20px; display: block; }
        .nav-item small { font-size: 10px; font-weight: 700; text-transform: uppercase; }

        /* --- ANIMATIONS --- */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(162, 89, 255, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(162, 89, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(162, 89, 255, 0); }
        }

        .main-coin {
            transition: transform 0.1s;
        }
        .main-coin:active { transform: scale(0.9); }

        .spinner {
            width: 30px; height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="app-content" style="padding-bottom: 90px;">
        {% block content %}{% endblock %}
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="showPage('p-mine', this)">
            <span>⛏️</span><small>Mine</small>
        </div>
        <div class="nav-item" onclick="showPage('p-launcher', this)">
            <span>🚀</span><small>Launcher</small>
        </div>
        <div class="nav-item" onclick="showPage('p-trade', this)">
            <span>📈</span><small>Trade</small>
        </div>
        <div class="nav-item" onclick="showPage('p-wallet', this)">
            <span>💼</span><small>Wallet</small>
        </div>
        <div class="nav-item" onclick="showPage('p-profil', this)">
            <span>👤</span><small>Profil</small>
        </div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // LOGIQUE DE NAVIGATION ENTRE LES PAGES
        function showPage(pageId, navElement) {
            // Cacher toutes les pages
            document.querySelectorAll('.page').forEach(p => {
                p.classList.remove('active-page');
            });
            // Afficher la page sélectionnée
            document.getElementById(pageId).classList.add('active-page');

            // Gérer l'état actif de la navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            navElement.classList.add('active');

            // Petit retour haptique Telegram
            tg.HapticFeedback.selectionChanged();
        }

        // --- TES FONCTIONS JS (A relier à ton backend) ---
        function mine(type, event) {
            tg.HapticFeedback.impactOccurred('light');
            console.log("Minage lancé :", type);
            // Ici ton appel fetch vers Railway
        }

        function buyStarsPack(amount) {
            console.log("Achat stars :", amount);
            // Fonction déjà vue hier
        }
    </script>
</body>
</html>
