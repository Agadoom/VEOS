{% extends "base.html" %}

{% block content %}

<div id="p-mine" class="page active-page">
    <div class="prof-header" style="text-align: center; padding: 20px 0;">
        <small id="prof-rank" style="color:var(--gold); font-weight:900;">RANK: #---</small>
        <h1 id="tot" style="font-size:48px; margin:5px 0; font-family:monospace; font-weight:800;">0.00</h1>
        
        <div style="padding: 0 20px;">
            <div style="background:#1a1a1c; height:10px; border-radius:10px; margin:10px 0; border: 1px solid #333; overflow: hidden;">
                <div id="e-f" style="background: linear-gradient(90deg, var(--gold), #ffaa00); height:100%; width:0%; transition:0.4s;"></div>
            </div>
            <div style="display:flex; justify-content: space-between;">
                <small id="e-t" style="opacity: 0.8; font-size:11px;">Energy: 0/100</small>
                <small style="color:var(--gold); font-size:10px; font-weight:900;">⚡ AUTO</small>
            </div>
        </div>
    </div>

    <div style="text-align: center; margin-bottom: 20px;">
        <span style="background: rgba(235, 64, 52, 0.1); color: #eb4034; padding: 5px 15px; border-radius: 20px; font-size: 11px; font-weight: 800; border: 1px solid rgba(235, 64, 52, 0.2);">
            🔥 TOTAL BURNED: <span id="global-burned-val">0.00</span> WPT
        </span>
    </div>

    <div style="display: grid; gap: 10px;">
        <div class="card">
            <div><b>Genesis (WPT)</b><br><small id="gv">0.00</small></div>
            <button class="btn" onclick="mine('genesis', event)">MINE</button>
        </div>
        <div class="card">
            <div><b>Unity Pool</b><br><small id="uv">0.00</small></div>
            <button class="btn" style="background: #eee; color: #000;" onclick="mine('unity', event)">SYNC</button>
        </div>
        <div class="card" style="border-color: var(--purple);">
            <div><b style="color:var(--purple);">Veo AI</b><br><small id="vv">0.00</small></div>
            <button class="btn" style="background:var(--purple); color:#fff;" onclick="mine('veo', event)">COMPUTE</button>
        </div>
    </div>

    <div class="coin-container" style="text-align:center; margin-top:30px;">
        <img src="/static/genesis.png" class="main-coin" style="width:160px; cursor:pointer;" onclick="mine('genesis', event)">
    </div>
</div>

<div id="p-launcher" class="page">
    <h2 style="text-align:center;">🚀 LAUNCHPAD</h2>
    <div class="card" style="flex-direction:column; gap:10px; padding:20px;">
        <b style="color:var(--gold);">NEW ECOSYSTEM TOKEN</b>
        <input type="text" id="tk-name" class="l-input" placeholder="Token Name">
        <input type="text" id="tk-sym" class="l-input" placeholder="$SYMBOL">
        <button class="btn" style="width:100%;" onclick="deployToken()">LAUNCH (5,000 WPT)</button>
    </div>
    <div id="token-list" style="margin-top:20px;"></div>
</div>

<div id="p-wallet" class="page">
    <h2 style="text-align:center;">💼 WALLET</h2>
    <div class="card" style="flex-direction:column; text-align:center; padding:35px;">
        <small style="opacity:0.5;">WPT BALANCE</small>
        <h1 id="wallet-balance" style="font-size:40px; color:var(--gold); margin:10px 0;">0.00</h1>
        <button class="btn" style="background:#0088cc; color:white;" onclick="connectTon()">CONNECT TON</button>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
        <div class="card" style="flex-direction:column; padding:15px;">
            <b>⭐ 50 Stars</b>
            <button class="btn" onclick="buyStarsPack(50)" style="margin-top:10px;">BUY</button>
        </div>
        <div class="card" style="flex-direction:column; padding:15px; border-color:var(--gold);">
            <b>⭐ 250 Stars</b>
            <button class="btn" onclick="buyStarsPack(250)" style="margin-top:10px;">BUY</button>
        </div>
    </div>
</div>

<div id="p-profil" class="page">
    <div class="prof-header" style="text-align:center; padding:30px;">
        <div id="prof-initials" style="width:70px; height:70px; background:var(--gold); border-radius:50%; margin:0 auto 15px; display:flex; align-items:center; justify-content:center; color:#000; font-weight:900; font-size:28px;">U</div>
        <h2 id="prof-name">USER</h2>
        <h1 id="usd-val" style="color:var(--green);">$0.00</h1>
    </div>
    <div id="user-portfolio"></div>
    <div id="leaderboard" style="margin-top:20px; padding-bottom:50px;"></div>
</div>

<div id="p-lottery" class="page">
    <h2 style="text-align:center; color:var(--gold);">🎰 JACKPOT</h2>
