{% extends "base.html" %}

{% block content %}
<div id="main-wrapper" style="height: 100vh; overflow-y: auto; background: #000;">

    <div id="p-mine" class="page active-page">
        <div class="mine-hero">
            <div class="rank-badge">🏆 RANK #<span id="prof-rank-val">---</span></div>
            <h1 id="tot" class="glitch-text">0.00</h1>
            <div class="usd-val">$<span id="header-usd">0.00</span></div>
            
            <div class="energy-section">
                <div class="energy-bar">
                    <div id="e-f" class="energy-fill"></div>
                </div>
                <div class="energy-info">
                    <small id="e-t">Energy: 0/100</small>
                    <small class="auto-tag">⚡ AUTO</small>
                </div>
            </div>
        </div>

        <div class="mining-grid">
            <div class="m-card" onclick="mine('genesis', event)">
                <div class="m-icon">💎</div>
                <b>Genesis</b><br><small id="gv">0.00</small>
            </div>
            <div class="m-card" onclick="mine('unity', event)">
                <div class="m-icon">🌀</div>
                <b>Unity</b><br><small id="uv">0.00</small>
            </div>
            <div class="m-card" onclick="mine('veo', event)">
                <div class="m-icon">🧠</div>
                <b>Veo AI</b><br><small id="vv">0.00</small>
            </div>
        </div>

        <div class="tap-area">
            <div class="tap-glow"></div>
            <img src="/static/genesis.png" class="main-coin" onclick="mine('genesis', event)">
        </div>
    </div>

    <div id="p-wallet" class="page" style="display:none; padding: 20px;">
        <div class="balance-card">
            <small>WPT BALANCE</small>
            <h1 id="wallet-balance">0.00</h1>
            <div id="ton-connect-btn"></div>
        </div>

        <div class="jackpot-banner" onclick="toggleLottery()">
            <div style="display:flex; gap:15px; align-items:center;">
                <span style="font-size:30px;">🎰</span>
                <div>
                    <b style="color:#A259FF;">WPT JACKPOT</b>
                    <div id="jackpot-val" style="font-size:20px; font-weight:900;">5,400,000</div>
                </div>
            </div>
            <button class="btn-play">JOIN</button>
        </div>
        
        <div id="sub-lottery" style="display:none; margin-top:10px;">
            <div class="lottery-box">
                <input type="number" id="lottery-bid" placeholder="Amount to donate...">
                <button onclick="enterLottery()" class="btn-purple">ENTER DRAW</button>
            </div>
        </div>
    </div>

    <div id="p-profil" class="page" style="display:none;">
        <div class="profile-header">
            <div id="prof-initials">U</div>
            <h2 id="prof-name">USER</h2>
            <div class="stats-row">
                <div class="s-item"><small>RANK</small><b id="prof-rank-big">#---</b></div>
                <div class="s-item"><small>NET WORTH</small><b id="total-net-worth" style="color:#00ff88;">$0.00</b></div>
            </div>
        </div>
        <div class="asset-list-container">
            <h3>ASSETS</h3>
            <div id="asset-list"></div>
        </div>
    </div>

</div>

<div id="launcher-drawer" class="drawer">
    <div class="drawer-handle" onclick="toggleLauncher()"></div>
    <div class="drawer-body">
        <h2>🚀 LAUNCHPAD</h2>
        <div class="form-group">
            <input type="text" id="tk-name" placeholder="Token Name">
            <input type="text" id="tk-sym" placeholder="Symbol ($)">
            <textarea id="tk-desc" placeholder="Describe your vision..."></textarea>
            <button class="btn-launch" onclick="deployToken()">LAUNCH (5,000 WPT)</button>
        </div>
        <div id="token-list"></div>
    </div>
</div>

<div id="fab-launcher" onclick="toggleLauncher()">🚀</div>

{% endblock %}
