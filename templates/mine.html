{% extends "base.html" %}

{% block content %}

<div id="p-mine" class="page active-page">
    <div class="prof-header" style="background: linear-gradient(180deg, rgba(255,204,0,0.05) 0%, transparent 100%); padding: 20px 0; text-align: center;">
        <small id="prof-rank" style="color:var(--gold); font-weight:900; letter-spacing: 1px;">RANK: #---</small>
        <h1 id="tot" style="font-size:48px; margin:5px 0; font-family: 'monospace'; font-weight: 800; text-shadow: 0 0 15px rgba(255,255,255,0.1);">0.00</h1>
        
        <div style="padding: 0 20px;">
            <div style="background:#1a1a1c; height:10px; border-radius:10px; margin:10px 0; border: 1px solid #333; overflow: hidden; position: relative;">
                <div id="e-f" style="background: linear-gradient(90deg, var(--gold), #ffaa00); height:100%; width:0%; transition:0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67); position: relative;">
                    <div style="position:absolute; top:0; left:0; right:0; bottom:0; background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 100%);"></div>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <small id="e-t" style="color:var(--text); font-weight: bold; font-size: 11px; opacity: 0.8;">Energy: 0/100</small>
                <div style="display: flex; gap: 5px; align-items: center;">
                    <span id="turbo-status" style="display:none; background:#A259FF; color:white; font-size:9px; padding:2px 6px; border-radius:10px; font-weight:900; animation: pulse 1.5s infinite;">⚡ TURBO</span>
                </div>
                <small style="color:var(--gold); font-size: 10px; font-weight: 900;">⚡ AUTO</small>
            </div>
        </div>
    </div>

    <div style="display: grid; gap: 10px; margin-top: 10px;">
        <div class="card" style="margin-bottom: 0; padding: 12px 18px;">
            <div><b>Genesis <span style="color:var(--gold)">(WPT)</span></b><br><small id="gv">0.00</small></div>
            <button class="btn" onclick="mine('genesis', event)">MINE</button>
        </div>
        
        <div class="card" style="margin-bottom: 0; padding: 12px 18px;">
            <div><b>Unity Pool</b><br><small id="uv">0.00</small></div>
            <button class="btn" style="background: #eee; color:#000;" onclick="mine('unity', event)">SYNC</button>
        </div>

        <div class="card" style="margin-bottom: 0; padding: 12px 18px; border-color: rgba(162, 89, 255, 0.3);">
            <div><b style="color:var(--purple);">Veo AI</b><br><small id="vv">0.00</small></div>
            <button class="btn" style="background:var(--purple); color:#fff;" onclick="mine('veo', event)">COMPUTE</button>
        </div>
    </div>

    <div class="coin-container" style="text-align:center; margin-top:35px; position: relative;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 140px; background: var(--gold); filter: blur(40px); opacity: 0.15; border-radius: 50%; pointer-events: none;"></div>
        <img src="/static/genesis.png" class="main-coin" style="width:170px; height: 170px; cursor:pointer;" onclick="mine('genesis', event)">
    </div>
</div>




<div id="p-launcher" class="page" style="display:none;">
    <h2 style="text-align:center; font-weight: 800; color: #fff; margin-bottom: 20px;">🚀 LAUNCHPAD</h2>

    <div style="padding: 0 10px 15px 10px;">
        <div style="position: relative;">
            <span style="position: absolute; left: 12px; top: 12px; opacity: 0.5;">🔍</span>
            <input type="text" id="token-search" oninput="loadMarket()" placeholder="Search tokens..." style="width: 100%; padding: 12px 12px 12px 40px; border-radius: 15px; border: 1px solid #333; background: rgba(255,255,255,0.03); color: white; box-sizing: border-box;">
        </div>
    </div>

    <div class="card" style="flex-direction:column; align-items:stretch; gap:12px; background: linear-gradient(145deg, #0a0a0b, #121214); padding:20px; border: 1px solid #222;">
        <div style="text-align:center;">
            <b style="color:var(--gold); text-transform: uppercase; font-size: 12px; letter-spacing: 1px;">Create Ecosystem Token</b>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <input type="text" id="tk-name" class="l-input" placeholder="Token Name">
            <input type="text" id="tk-sym" class="l-input" placeholder="$SYMBOL">
        </div>
        
        <textarea id="tk-desc" class="l-input" style="height:65px; resize: none;" placeholder="Project description..."></textarea>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <label class="upload-box" style="border: 1px dashed #444; padding:12px; border-radius:12px; text-align:center; font-size:11px; cursor:pointer; background: rgba(255,255,255,0.02);">
                <span id="label-logo">🖼️ Add Logo</span>
                <input type="file" id="f-logo" hidden onchange="document.getElementById('label-logo').innerText='✅ Logo OK'">
            </label>
            <label class="upload-box" style="border: 1px dashed #444; padding:12px; border-radius:12px; text-align:center; font-size:11px; cursor:pointer; background: rgba(255,255,255,0.02);">
                <span id="label-banner">🌅 Add Banner</span>
                <input type="file" id="f-banner" hidden onchange="document.getElementById('label-banner').innerText='✅ Banner OK'">
            </label>
        </div>
        
        <button class="btn" style="background:var(--gold); color:#000; width:100%; font-weight:900; height: 45px; margin-top: 5px;" onclick="deployToken()">LAUNCH TOKEN (5,000 WPT)</button>
    </div>

    <div style="display: flex; gap: 10px; margin: 25px 0 15px 0; overflow-x: auto; padding-bottom: 5px;">
        <div onclick="setFilter('new', this)" class="tab-btn active-tab" style="padding: 8px 15px; background: var(--gold); color: black; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer;">✨ New</div>
        <div onclick="setFilter('hot', this)" class="tab-btn" style="padding: 8px 15px; background: #111; color: white; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; border: 1px solid #222;">🔥 Hot</div>
        <div onclick="setFilter('my', this)" class="tab-btn" style="padding: 8px 15px; background: #111; color: white; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; border: 1px solid #222;">👤 My</div>
    </div>

    <div id="token-list" style="padding-bottom: 30px; display: grid; gap: 12px;">
        <p style="text-align:center; opacity:0.3; padding:20px;">Scanning network for tokens...</p>
    </div>
</div>






{% endblock %}
