<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>WPT Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #FFD700; --purple: #A259FF; --green: #4caf50; --red: #eb4034; --text: #eee; }
        body { background: #000; color: white; font-family: sans-serif; margin: 0; overflow-x: hidden; }
        .container { padding: 15px; padding-bottom: 100px; max-width: 500px; margin: auto; }
        .page { display: none; animation: fadeIn 0.3s; }
        .active-page { display: block !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card { background: #111; border: 1px solid #333; padding: 15px; border-radius: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: var(--gold); border: none; padding: 10px 18px; border-radius: 12px; font-weight: 900; cursor: pointer; }
        .l-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; margin-bottom: 10px; box-sizing: border-box; }
        .nav { position: fixed; bottom: 0; width: 100%; background: rgba(5,5,5,0.9); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; backdrop-filter: blur(10px); z-index: 999; }
        .n-i { font-size: 24px; opacity: 0.4; cursor: pointer; }
        .n-i.active { opacity: 1; filter: drop-shadow(0 0 8px var(--gold)); }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <nav class="nav">
        <div onclick="showPage('p-mine')" id="n-mine" class="n-i active">🏠</div>
        <div onclick="showPage('p-launcher')" id="n-launcher" class="n-i">🚀</div>
        <div onclick="showPage('p-lottery')" id="n-lottery" class="n-i">🎰</div>
        <div onclick="showPage('p-wallet')" id="n-wallet" class="n-i">💼</div>
        <div onclick="showPage('p-profil')" id="n-profil" class="n-i">👤</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        const uid = tg.initDataUnsafe?.user?.id || 12345;
        const BASE_URL = window.location.origin;

        function showPage(pId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pId).classList.add('active-page');
            document.querySelectorAll('.n-i').forEach(i => i.classList.remove('active'));
            const navId = pId.startsWith('p-details') ? 'n-launcher' : pId.replace('p-', 'n-');
            document.getElementById(navId)?.classList.add('active');
            if(pId === 'p-launcher') loadMarket();
            if(pId === 'p-profil') { loadPortfolio(); loadLeaderboard(); }
            tg.HapticFeedback?.impactOccurred('light');
        }

        async function refresh() {
            try {
                const r = await fetch(`${BASE_URL}/api/user/${uid}`);
                const d = await r.json();
                document.getElementById('tot').innerText = d.score.toLocaleString();
                document.getElementById('wallet-balance').innerText = d.g.toLocaleString();
                document.getElementById('e-f').style.width = d.energy + "%";
                document.getElementById('e-t').innerText = "Energy: " + Math.floor(d.energy) + "/100";
            } catch(e) {}
        }

        async function mine(type) {
            const r = await fetch(`${BASE_URL}/api/mine`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: uid, token_type: type})
            });
            const res = await r.json();
            if(res.ok) { refresh(); tg.HapticFeedback?.impactOccurred('medium'); }
        }

        async function loadMarket() {
            const r = await fetch(`${BASE_URL}/api/launcher/market`);
            const tokens = await r.json();
            document.getElementById('token-list').innerHTML = tokens.map(t => `
                <div class="card" onclick="openDetails('${t.symbol}')">
                    <b>${t.name} ($${t.symbol})</b>
                    <span>${t.price} WPT</span>
                </div>
            `).join('');
        }

        window.onload = () => { tg.expand(); refresh(); setInterval(refresh, 10000); };
    </script>
</body>
</html>
