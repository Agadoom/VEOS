<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>One World Peace Coins</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        :root {
    --gold: #FFD700;
    --purple: #A259FF;
    --dark-card: #0a0a0b;
    --border: rgba(255, 255, 255, 0.08);
}

body { background: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; }

/* Menu de Navigation en bas */
.nav-bar {
    position: fixed; bottom: 0; width: 100%; height: 70px;
    background: rgba(10, 10, 11, 0.8); backdrop-filter: blur(20px);
    display: flex; justify-content: space-around; align-items: center;
    border-top: 1px solid var(--border); z-index: 100;
}

/* Sections de l'App */
.page { display: none; padding: 20px; padding-bottom: 100px; min-height: 100vh; box-sizing: border-box; }
.active-page { display: block; animation: fadeIn 0.3s ease; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Cards de Minage & Assets */
.card-pro {
    background: var(--dark-card); border: 1px solid var(--border);
    border-radius: 20px; padding: 15px; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between;
}

.btn-main {
    background: var(--gold); color: #000; border: none;
    padding: 10px 20px; border-radius: 12px; font-weight: 900;
    cursor: pointer; transition: 0.2s;
}

.btn-main:active { transform: scale(0.95); }

/* Progress Bars */
.bar-container { background: #1a1a1c; height: 8px; border-radius: 10px; overflow: hidden; margin: 10px 0; }
.bar-fill { background: var(--gold); height: 100%; transition: 0.4s; }

/* Launcher Drawer */
.drawer {
    position: fixed; bottom: -100%; left: 0; width: 100%; height: 85vh;
    background: #0a0a0b; border-radius: 30px 30px 0 0;
    border-top: 2px solid var(--gold); z-index: 1000;
    transition: 0.5s cubic-bezier(0.32, 0.72, 0, 1);
    padding: 25px; box-sizing: border-box;
}
.drawer.active { bottom: 0; }

/* Floating Button */
#fab-launcher {
    position: fixed; bottom: 90px; right: 20px; width: 60px; height: 60px;
    background: var(--gold); border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 24px;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); z-index: 99;
}


    </style>
</head>
<body>
    <div class="ticker">🏆 NETWORK ACTIVE ● TRADING ENABLED ● MINE WPT</div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <nav class="nav">
        <div onclick="showPage('p-mine')" id="n-mine" class="n-i active">🏠</div>
        <div onclick="showPage('p-launcher')" id="n-launcher" class="n-i">🚀</div>
        <div onclick="showPage('p-lottery')" id="n-lottery" class="n-i">🎰</div>
        <div onclick="showPage('p-wallet')" id="n-wallet" class="n-i">💼</div>
        <div onclick="showPage('p-profil')" id="n-profil" class="n-i">👤</div>
    </nav>

    <script>
    const tg = window.Telegram.WebApp;
    // CRITIQUE : Récupérer l'ID réel de l'utilisateur Telegram
    const uid = tg.initDataUnsafe?.user?.id || 12345; 
    // REMPLACE PAR TON URL RÉELLE RAILWAY
const BASE_URL = window.location.origin; 
// OU SI TEST LOCAL :
// const BASE_URL = "https://ton-app.railway.app"; 




// --- GESTION DES PAGES ---
function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    const target = document.getElementById(id);
    if (target) {
        target.style.display = 'block';
        tg.HapticFeedback.impactOccurred('medium');
    }
}

// --- GESTION DU LAUNCHER (Drawer) ---
function toggleLauncher() {
    const drawer = document.getElementById('launcher-drawer');
    drawer.classList.toggle('active');
    tg.HapticFeedback.selectionChanged();
}

// --- SYSTÈME DE TRADE DYNAMIQUE ---
function openTrade(symbol) {
    const asset = window.lastData.assets.find(a => a.symbol === symbol);
    if (!asset) return;

    // Remplissage des données
    document.getElementById('tr-name').innerText = asset.name;
    document.getElementById('tr-icon').src = asset.icon;
    document.getElementById('tr-price').innerText = `$${parseFloat(asset.current_price).toFixed(8)}`;
    
    showPage('p-trade');
    
    // Injection du Chart
    const chartContainer = document.getElementById('tr-chart-container');
    if (symbol === 'GWPC') {
        chartContainer.innerHTML = `<iframe src="https://dexscreener.com/ton/EQB6KPJ3W155V6iQH4ERfhfWtngZYTNvhMmpOkXea66hWhO6?embed=1&theme=dark" style="width:100%; height:100%; border:none;"></iframe>`;
    } else {
        chartContainer.innerHTML = `<div class="chart-placeholder">Chart Coming Soon</div>`;
    }
}

// --- SYSTÈME DE REFRESH GLOBAL ---
// Variable pour éviter les erreurs de undefined
// GLOBAL SYNC DATA
window.lastData = null;

// REFRESH ENGINE
async function refresh() {
    try {
        const response = await fetch(`${BASE_URL}/api/user/${uid}`);
        const data = await response.json();
        window.lastData = data;

        // UI SYNC - MINE
        document.getElementById('tot').innerText = parseFloat(data.score).toLocaleString();
        document.getElementById('prof-rank-val').innerText = data.rank;
        document.getElementById('header-usd').innerText = parseFloat(data.usd_value).toFixed(2);
        document.getElementById('e-f').style.width = data.energy + "%";

        // UI SYNC - WALLET & PROFIL
        document.getElementById('wallet-balance').innerText = parseFloat(data.score).toLocaleString();
        document.getElementById('prof-name').innerText = data.name || "CITIZEN";
        document.getElementById('prof-rank-big').innerText = "#" + data.rank;
        document.getElementById('total-net-worth').innerText = "$" + parseFloat(data.usd_value).toFixed(2);

        updateAssets(data.assets);
    } catch (e) { console.error("Sync Error:", e); }
}

// ASSET RENDERER
function updateAssets(assets) {
    const container = document.getElementById('asset-list');
    if (!container) return;
    container.innerHTML = assets.map(a => `
        <div class="asset-row" onclick="openTrade('${a.symbol}')">
            <img src="${a.icon}" class="a-icon">
            <div class="a-info">
                <b>${a.name}</b>
                <small>${parseFloat(a.balance).toFixed(2)} ${a.symbol}</small>
            </div>
            <div class="a-price">$${(a.balance * a.current_price).toFixed(2)}</div>
        </div>
    `).join('');
}

// DRAWER CONTROLS
function toggleLauncher() {
    document.getElementById('launcher-drawer').classList.toggle('active');
    tg.HapticFeedback.impactOccurred('medium');
}

function toggleLottery() {
    const lot = document.getElementById('sub-lottery');
    lot.style.display = lot.style.display === 'none' ? 'block' : 'none';
}

// START ENGINE
setInterval(refresh, 5000);
refresh();




</script>

</body>
</html>
