<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One World Peace Coins</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --gold: #FFD700;
            --purple: #A259FF;
            --bg: #000000;
            --card-bg: #0a0a0b;
            --text: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-user-select: none;
        }

        /* --- STYLES GENERAUX --- */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .active-page { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #1a1a1c;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn {
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }

        .l-input {
            background: #111;
            border: 1px solid #333;
            color: white;
            padding: 10px;
            border-radius: 10px;
            outline: none;
        }

        /* --- NAVIGATION BASSE --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: rgba(10, 10, 11, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #1a1a1c;
            z-index: 1000;
        }

        .nav-item {
            text-align: center;
            opacity: 0.5;
            transition: 0.3s;
            cursor: pointer;
        }
        .nav-item.active {
            opacity: 1;
            color: var(--gold);
        }
        .nav-item span { font-size: 20px; display: block; }
        .nav-item small { font-size: 10px; font-weight: 700; text-transform: uppercase; }

        /* --- ANIMATIONS --- */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(162, 89, 255, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(162, 89, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(162, 89, 255, 0); }
        }

        .main-coin {
            transition: transform 0.1s;
        }
        .main-coin:active { transform: scale(0.9); }

        .spinner {
            width: 30px; height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }



/* Animation de l'onde bleue au clic */
.mine-ripple {
    position: absolute;
    border: 2px solid #00d2ff;
    background: rgba(0, 210, 255, 0.2);
    border-radius: 50%;
    pointer-events: none;
    transform: scale(0);
    animation: ripple-out 0.6s ease-out;
    z-index: 99;
}

@keyframes ripple-out {
    to {
        transform: scale(4);
        opacity: 0;
    }
}

/* Effet de lueur bleue sur la pièce au clic */
.main-coin:active {
    transform: scale(0.92);
    filter: drop-shadow(0 0 30px #00d2ff) brightness(1.2);
    transition: 0.1s;
}

/* Style des petits "+0.05" qui montent en bleu */
.floating-reward {
    position: absolute;
    color: #00d2ff;
    font-weight: 900;
    font-size: 20px;
    pointer-events: none;
    animation: float-up 0.8s forwards;
    text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
    z-index: 100;
}

@keyframes float-up {
    to {
        transform: translateY(-100px) scale(1.2);
        opacity: 0;
    }
}


.drawer {
    position: fixed;
    bottom: -100%;
    left: 0;
    width: 100%;
    background: #0a0a0b;
    border-top: 2px solid var(--gold);
    border-radius: 30px 30px 0 0;
    transition: 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 1000;
    padding: 20px;
    box-sizing: border-box;
}
.drawer.active { bottom: 0; }





/* Effet de lueur sur le container */
.launchpad-blueprint {
    position: relative;
    background: radial-gradient(circle at top right, rgba(255,215,0,0.05), transparent);
    border: 1px solid rgba(255, 215, 0, 0.1);
    overflow: hidden;
}

/* Animation des coins du dessin technique */
.launchpad-blueprint::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 20px; height: 20px;
    border-top: 2px solid var(--gold); border-left: 2px solid var(--gold);
}

.launchpad-blueprint::after {
    content: "";
    position: absolute;
    bottom: 0; right: 0; width: 20px; height: 20px;
    border-bottom: 2px solid var(--gold); border-right: 2px solid var(--gold);
}

/* Style des inputs futuristes */
.l-input {
    background: rgba(255, 255, 255, 0.03) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    transition: 0.3s;
    font-size: 13px;
}

.l-input:focus {
    border-color: var(--gold) !important;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
}

/* Bouton de lancement animé */
.btn-launch {
    position: relative;
    overflow: hidden;
    transition: 0.3s;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.btn-launch:active {
    transform: scale(0.98);
}

.btn-launch::after {
    content: "";
    position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: rotate(45deg);
    animation: shine-launch 3s infinite;
}

@keyframes shine-launch {
    0% { left: -150%; }
    100% { left: 150%; }
}

    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px;

.gold-text { color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.3); }




.trade-tab {

.trade-tab.active {

.stars-pack {

    text-align: center;
    transition: 0.3s;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.stars-pack:active { transform: scale(0.95); background: rgba(255, 215, 0, 0.05); }

.btn-stars {
    margin-top: 12px;

    padding: 6px 15px;
    border-radius: 20px;

}

    border-color: var(--gold);

/* Cacher la scrollbar pour le menu filtres */
div[style*="overflow-x: auto"]::-webkit-scrollbar {
    display: none;
}


/* Pour que le menu horizontal soit beau */
.filter-btn {
    min-width: 100px;
    text-align: center;

    </style>

    <script>
        const tg = window.Telegram.WebApp;
const userData = tg.initDataUnsafe.user;
const uid = userData ? userData.id : 12345678; // 12345678 est pour tes tests PC

// FORCE LE PREMIER REFRESH
document.addEventListener('DOMContentLoaded', () => {
    refresh(); 
    setInterval(refresh, 5000); // Sync toutes les 5 sec
});
        tg.expand();
        tg.enableClosingConfirmation();
        const BASE_URL = "https://veos-production-a2de.up.railway.app";








   // 1. INITIALISATION CORRIGÉE
document.addEventListener('DOMContentLoaded', () => {
    // Petit délai pour laisser Telegram initialiser l'ID
    setTimeout(() => {
        refresh(); 
        loadRecentTokens(); // CHARGE LES TOKENS DIRECTEMENT AU DÉBUT
        setInterval(refresh, 5000); 
    }, 500);

    // Force l'affichage de la mine au départ
    const minePage = document.getElementById('p-mine');
    if (minePage) minePage.style.display = 'block';
});

// 2. NAVIGATION CORRIGÉE (Pour charger les tokens au clic)
function showPage(pageId, navElement) {
    // 1. On cache TOUTES les pages
    document.querySelectorAll('.page').forEach(p => {
        p.style.display = 'none';
        p.classList.remove('active-page');
    });

    // 2. On affiche LA page demandée
    const target = document.getElementById(pageId);
    if (target) {
        target.style.display = 'block';
        target.classList.add('active-page');
    }

    // --- LA CLÉ EST ICI ---
    if (pageId === 'p-leaderboard') {
        console.log("🏆 Ouverture du Leaderboard...");
        loadLeaderboard(); // On force l'appel API
    }
    if (pageId === 'p-launcher') {
        loadRecentTokens();
    }

    // 3. Update visuel du menu en bas
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    if (navElement) navElement.classList.add('active');

    tg.HapticFeedback.selectionChanged();
}






async function refresh() {
    if (!uid) {
        console.log("🛰️ En attente de l'UID utilisateur...");
        return;
    }
    
    try {
        const response = await fetch(`${BASE_URL}/api/user/${uid}`);
        if (!response.ok) throw new Error("Erreur Serveur");
        
        const d = await response.json();
        
        // Stockage global pour les autres composants
        window.lastData = d; 

        // A. MISE À JOUR DE LA MINE & RANK
// On s'assure que rank est traité comme du texte
let displayRank = "#---";
if (d.rank !== undefined && d.rank !== null && d.rank !== "---") {
    displayRank = "#" + d.rank;
}

if (document.getElementById('prof-rank-val')) document.getElementById('prof-rank-val').innerText = displayRank;
if (document.getElementById('prof-rank-big')) document.getElementById('prof-rank-big').innerText = displayRank;

        
        if (document.getElementById('tot')) {
            // Utilisation de toLocaleString pour avoir les espaces (ex: 400 381)
            document.getElementById('tot').innerText = d.score.toLocaleString('fr-FR', { minimumFractionDigits: 2 });
        }
        
        if (document.getElementById('header-usd')) {
            document.getElementById('header-usd').innerText = d.usd_value.toFixed(2);
        }

        // B. ÉNERGIE (Barre et Texte)
        if (document.getElementById('e-f')) {
            document.getElementById('e-f').style.width = d.energy + "%";
        }
        if (document.getElementById('e-t')) {
            document.getElementById('e-t').innerText = `Energy: ${d.energy}/100`;
        }

        // C. COMPTEURS INDIVIDUELS (Genesis, Unity, Veo)
        // On s'assure que les IDs correspondent bien à ton HTML
        if (document.getElementById('gv')) document.getElementById('gv').innerText = d.g.toLocaleString();
        if (document.getElementById('uv')) document.getElementById('uv').innerText = d.u.toLocaleString();
        if (document.getElementById('vv')) document.getElementById('vv').innerText = d.v.toLocaleString();

        // D. WALLET
        if (document.getElementById('wallet-balance')) {
            document.getElementById('wallet-balance').innerText = d.score.toLocaleString();
        }

        // E. PROFIL & ASSETS
        updateProfilUI(d);

        console.log("🛰️ Sync OK | Rank:", displayRank, "| Score:", d.score);

    } catch (error) {
        console.error("❌ Erreur de synchronisation:", error);
    }

if (pageId === 'p-leaderboard') {
        loadLeaderboard();
    }


}






// Fonction pour injecter les assets dans le profil
function updateProfilUI(d) {
    const assetList = document.getElementById('asset-list');
    if (!assetList || !d.assets) return;

    assetList.innerHTML = ''; 

    d.assets.forEach(asset => {
        // Sécurité : s'assurer que balance et price sont des nombres
        const balance = parseFloat(asset.balance) || 0;
        const price = parseFloat(asset.current_price) || 0;
        const value = (balance * price).toFixed(2);
        
        assetList.innerHTML += `
            <div class="card-pro" onclick="openTradeSection('${asset.symbol}')" style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.03); padding:15px; border-radius:15px; margin-bottom:10px; border:1px solid #1a1a1c;">
                <div style="display:flex; align-items:center; gap:12px;">
                    <img src="${asset.icon}" style="width:35px; height:35px; border-radius:10px;" onerror="this.src='/static/genesis.png'">
                    <div>
                        <b style="display:block; font-size:14px;">${asset.name}</b>
                        <small style="opacity:0.4;">${balance.toLocaleString()} ${asset.symbol}</small>
                    </div>
                </div>
                <div style="text-align:right;">
                    <b style="display:block;">$${value}</b>
                    <small style="color:${asset.change_24h >= 0 ? '#00ff88' : '#ff4444'}; font-size:10px;">
                        ${asset.change_24h >= 0 ? '+' : ''}${asset.change_24h}%
                    </small>
                </div>
            </div>
        `;
    });

    // --- FIX RANK & NET WORTH ---
    if (document.getElementById('prof-name')) document.getElementById('prof-name').innerText = d.name || "Citizen";
    
    const rankEl = document.getElementById('prof-rank-big');
    if (rankEl) {
        // On évite le double ## si d.rank contient déjà un # ou est vide
        const finalRank = (d.rank && d.rank !== "---") ? "#" + d.rank : "#---";
        rankEl.innerText = finalRank;
    }

    if (document.getElementById('total-net-worth')) {
        document.getElementById('total-net-worth').innerText = "$" + (parseFloat(d.usd_value) || 0).toFixed(2);
    }
}





        // --- TES FONCTIONS JS (A relier à ton backend) ---
       // MODIFICATION DE LA FONCTION MINE
function mine(type, event) {
    // 1. Retour Haptique
    tg.HapticFeedback.impactOccurred('medium');

    // 2. Visuel (Ripple bleu)
    const coinContainer = document.querySelector('.coin-container');
    if (coinContainer) {
        const ripple = document.createElement('div');
        ripple.className = 'mine-ripple';
        const rect = coinContainer.getBoundingClientRect();
        ripple.style.left = (event.clientX - rect.left - 25) + 'px';
        ripple.style.top = (event.clientY - rect.top - 25) + 'px';
        ripple.style.width = '50px'; ripple.style.height = '50px';
        coinContainer.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    }

    // 3. Texte flottant
    const rewardEffect = document.createElement('div');
    rewardEffect.className = 'floating-reward';
    rewardEffect.innerText = '+0.05';
    rewardEffect.style.left = event.clientX + 'px';
    rewardEffect.style.top = event.clientY + 'px';
    document.body.appendChild(rewardEffect);
    setTimeout(() => rewardEffect.remove(), 800);

    // 4. L'APPEL MANQUANT (On définit la fonction juste en dessous)
    sendMineRequest(type);
}

// AJOUT DE LA FONCTION DE COMMUNICATION
async function sendMineRequest(type) {
    try {
        const response = await fetch(`${BASE_URL}/api/mine`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                user_id: uid, // Récupéré au début du script
                token_type: type // 'genesis', 'unity' ou 'veo'
            })
        });

        const data = await response.json();

        if (data.ok) {
            // Mise à jour immédiate de l'interface avec le retour de mine.py
            if (document.getElementById('tot')) document.getElementById('tot').innerText = data.score.toLocaleString();
            if (document.getElementById('e-f')) document.getElementById('e-f').style.width = data.new_energy + "%";
            if (document.getElementById('e-t')) document.getElementById('e-t').innerText = `Energy: ${data.new_energy}/100`;
            
            // Mise à jour des compteurs spécifiques
            if (document.getElementById('gv')) document.getElementById('gv').innerText = data.genesis.toLocaleString();
            if (document.getElementById('uv')) document.getElementById('uv').innerText = data.unity.toLocaleString();
            if (document.getElementById('vv')) document.getElementById('vv').innerText = data.veo.toLocaleString();
        } else {
            console.error("Serveur erreur:", data.error);
            if(data.error === "Low energy") {
                tg.showAlert("Énergie insuffisante ! Attendez la recharge.");
            }
        }
    } catch (e) {
        console.error("Erreur réseau minage:", e);
    }
}






// 1. Fonction pour Créer un Token
async function deployToken() {
    const name = document.getElementById('tk-name').value;
    const symbol = document.getElementById('tk-sym').value;
    const desc = document.getElementById('tk-desc').value;
    const btn = document.getElementById('btn-deploy');

    if (!name || !symbol) {
        tg.showAlert("⚠️ Le nom et le symbole sont obligatoires !");
        return;
    }

    // Effet visuel sur le bouton
    btn.innerText = "DÉPLOIEMENT EN COURS...";
    btn.disabled = true;
    tg.HapticFeedback.impactOccurred('heavy');

    try {
        const response = await fetch(`${BASE_URL}/api/launcher/create`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                user_id: uid,
                name: name,
                symbol: symbol,
                description: desc
            })
        });

        const data = await response.json();

        if (data.ok) {
            tg.showAlert(`✅ Token ${symbol} créé avec succès !`);
            document.getElementById('tk-name').value = '';
            document.getElementById('tk-sym').value = '';
            document.getElementById('tk-desc').value = '';
            loadRecentTokens(); // Recharger la liste
            refresh(); // Mettre à jour le solde (car ça coûte 5000 WPT)
        } else {
            tg.showAlert("❌ Erreur: " + data.error);
        }
    } catch (e) {
        console.error("Erreur Launcher:", e);
        tg.showAlert("❌ Serveur indisponible.");
    } finally {
        btn.innerText = "DÉPLOYER (5,000 WPT)";
        btn.disabled = false;
    }
}

// 2. Fonction pour charger les tokens récents
async function loadRecentTokens() {
    const list = document.getElementById('token-list');
    if (!list) return;

    try {
        const response = await fetch(`${BASE_URL}/api/launcher/list`);
        const tokens = await response.json();

        list.innerHTML = ''; // Vider la liste

        tokens.forEach(t => {
            list.innerHTML += `
                <div class="card" style="background:rgba(255,255,255,0.02); border:1px solid #222; margin-bottom:10px; padding:15px; display:flex; justify-content:space-between; align-items:center;">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <div style="width:40px; height:40px; background:linear-gradient(45deg, var(--gold), #ffaa00); border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:900; color:#000;">
                            ${t.symbol[0]}
                        </div>
                        <div>
                            <b style="font-size:14px;">${t.name}</b><br>
                            <small style="color:var(--gold); font-size:10px;">$${t.symbol}</small>
                        </div>
                    </div>
                    // REMPLACE TON ANCIEN BOUTON PAR CELUI-CI :
<button class="btn" 
    style="padding:5px 15px; font-size:10px; background:#fff; color:#000;" 
    onclick="prepareTrade('${t.symbol}', '${t.name}', ${t.price || 0})">
    TRADE
</button>

                </div>
            `;
        });
    } catch (e) {
        console.log("Erreur chargement tokens");
    }
}

let myChart = null; // Variable globale pour le graphique

function prepareTrade(symbol, name, price) {
    console.log("🚀 Lancement du Trade pour:", name);

    // 1. Mise à jour immédiate des textes
    document.getElementById('trade-token-name-main').innerText = name;
    document.getElementById('trade-token-symbol-main').innerText = "$" + symbol;
    document.getElementById('trade-token-price-main').innerText = "$" + parseFloat(price).toFixed(6);
    
    // 2. Remplissage de la section ABOUT
    document.getElementById('trade-description').innerText = 
        `Le jeton ${name} (${symbol}) est listé sur One World Peace. Détails techniques et sécurité vérifiés sur la blockchain.`;
    
    document.getElementById('trade-links').innerHTML = `
        <button class="btn" style="padding:6px 12px; font-size:11px;" onclick="window.open('https://t.me/yourgroup')">Telegram</button>
        <button class="btn" style="padding:6px 12px; font-size:11px;" onclick="window.open('https://yourwebsite.com')">Website</button>
    `;

    // 3. Stats bidon pour le style
    document.getElementById('t-high').innerText = "$" + (parseFloat(price) * 1.05).toFixed(6);
    document.getElementById('t-mcap').innerText = (Math.random() * 10).toFixed(2) + "M $";

    // 4. Initialisation du Graphique Chart.js
    initTradeChart();

    // 5. Affichage de la page
    switchTradeTab('chart');
    showPage('p-trade');
    
    if(window.Telegram && Telegram.WebApp) Telegram.WebApp.HapticFeedback.impactOccurred('medium');
}

function initTradeChart() {
    const ctx = document.getElementById('tradeChartCanvas').getContext('2d');
    
    // Si un graphique existe déjà, on le détruit pour le recréer proprement
    if (myChart) myChart.destroy();

    // Génération de données aléatoires pour la courbe
    const labels = ['', '', '', '', '', '', '', '', '', ''];
    const dataPoints = Array.from({length: 10}, () => Math.random() * 100);

    myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Price',
                data: dataPoints,
                borderColor: '#00ff88',
                borderWidth: 3,
                pointRadius: 0,
                tension: 0.4, // Pour l'effet courbe lisse
                fill: true,
                backgroundColor: 'rgba(0, 255, 136, 0.1)'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { display: false },
                y: { display: false }
            }
        }
    });
}

function switchTradeTab(tab) {
    document.getElementById('trade-content-chart').style.display = (tab === 'chart') ? 'block' : 'none';
    document.getElementById('trade-content-about').style.display = (tab === 'about') ? 'block' : 'none';
    
    document.getElementById('tab-chart-btn').className = 'trade-tab' + (tab === 'chart' ? ' active' : '');
    document.getElementById('tab-about-btn').className = 'trade-tab' + (tab === 'about' ? ' active' : '');
}









async function loadRecentTokens() {
    try {
        // On charge d'abord la liste globale (Discover)
        const response = await fetch(`${BASE_URL}/api/launcher/list`);
        allTokens = await response.json();
        
        // On affiche par défaut
        filterTokens('discover');
    } catch (e) {
        console.error("Erreur chargement:", e);
    }
}

async function filterTokens(type, element) {
    const list = document.getElementById('token-list');
    if (!list) return;

    // UI : Boutons actifs
    if (element) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
    }

    if (type === 'my-fleet') {
        list.innerHTML = '<div class="spinner"></div>';
        try {
            // APPEL SPÉCIFIQUE : On demande au Python de filtrer par notre UID
            const response = await fetch(`${BASE_URL}/api/launcher/list?filter=my&uid=${uid}`);
            const myTokens = await response.json();
            renderTokenList(myTokens);
        } catch (e) {
            list.innerHTML = "Error loading your fleet.";
        }
    } else if (type === 'trending') {
        // On prend les tokens avec le prix le plus haut dans notre liste locale
        let trending = [...allTokens].sort((a, b) => b.price - a.price).slice(0, 5);
        renderTokenList(trending);
    } else {
        // Discover : Liste complète
        renderTokenList(allTokens);
    }
    tg.HapticFeedback.impactOccurred('light');
}






async function loadLeaderboard() {
    const container = document.getElementById('leaderboard-list');
    if (!container) return;

    // 1. On s'assure que le container est prêt
    console.log("🛰️ Tentative de connexion au Leaderboard...");

    try {
        // CORRECTION DE L'URL ICI : Ajout de /user/
        const response = await fetch(`${BASE_URL}/api/user/leaderboard`);
        
        if (!response.ok) {
            throw new Error(`Erreur HTTP: ${response.status}`);
        }

        const data = await response.json();
        console.log("🏆 Données Leaderboard reçues :", data);

        // 2. On VIDE le message "Scanning Blockchain..."
        container.innerHTML = ''; 

        if (!data || data.length === 0) {
            container.innerHTML = '<p style="text-align:center; opacity:0.5; padding:20px;">Aucun citoyen dans le protocole.</p>';
            return;
        }

        // 3. On injecte la liste
        data.forEach((u) => {
            let medal = u.rank;
            let goldClass = u.rank === 1 ? "gold-text" : "";
            if (u.rank === 1) medal = "🥇";
            if (u.rank === 2) medal = "🥈";
            if (u.rank === 3) medal = "🥉";

            container.innerHTML += `
                <div class="rank-card ${u.rank <= 3 ? 'rank-' + u.rank : ''}">
                    <div style="display:flex; align-items:center; gap:15px;">
                        <div class="rank-number">${medal}</div>
                        <div>
                            <b style="font-size:14px; color:#fff;">${u.name || 'Citizen'}</b><br>
                            <small style="opacity:0.4; font-size:9px;">ID: ${u.uid ? u.uid.toString().slice(0,6) : '???'}</small>
                        </div>
                    </div>
                    <div style="text-align:right;">
                        <b class="${goldClass}" style="font-size:14px;">${u.score.toLocaleString()}</b>
                        <small style="display:block; font-size:8px; color:var(--gold);">WPT</small>
                    </div>
                </div>
            `;
        });

    } catch (e) {
        console.error("❌ Crash Leaderboard :", e);
        container.innerHTML = `<p style="text-align:center; color:#ff4444; font-size:12px;">
            Échec de la synchronisation.<br><small>${e.message}</small>
        </p>`;
    }
}










        async function buyStars(starsAmount, wptAmount) {
    tg.HapticFeedback.impactOccurred('medium');
    
    // On affiche un petit loading
    const btn = event.currentTarget.querySelector('.btn-stars');
    const originalText = btn.innerText;
    btn.innerText = "⏳...";

    try {
        const response = await fetch(`${BASE_URL}/api/stars/create-invoice`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                user_id: uid,
                stars: starsAmount
            })
        });

        const data = await response.json();

        if (data.invoice_link) {
            // Ouvrir la facture Telegram
            tg.openInvoice(data.invoice_link, function(status) {
                if (status === 'paid') {
                    tg.showAlert(`🚀 BRAVO ! Tu as reçu ${wptAmount.toLocaleString()} WPT !`);
                    refresh(); // Recharge le solde
                } else {
                    tg.showAlert("❌ Paiement non complété.");
                }
            });
        } else {
            tg.showAlert("❌ Erreur serveur: " + (data.error || "Inconnu"));
        }
    } catch (e) {
        console.error("Crash Stars JS:", e);
        tg.showAlert("❌ Serveur injoignable.");
    } finally {
        btn.innerText = originalText;
    }
}




let currentOrderType = 'buy';

function openOrder(type) {
    currentOrderType = type;
    const price = document.getElementById('trade-token-price-main').innerText;
    
    document.getElementById('order-title').innerText = type + " " + document.getElementById('trade-token-symbol-main').innerText;
    document.getElementById('order-title').style.color = (type === 'buy') ? '#00ff88' : '#ff4444';
    document.getElementById('order-price').innerText = price;
    document.getElementById('order-confirm-btn').innerText = "CONFIRM " + type.toUpperCase();
    document.getElementById('order-confirm-btn').style.background = (type === 'buy') ? '#00ff88' : '#ff4444';

    document.getElementById('order-drawer').classList.add('active');
    document.getElementById('drawer-overlay').style.display = 'block';
    tg.HapticFeedback.impactOccurred('medium');
}

function closeOrder() {
    document.getElementById('order-drawer').classList.remove('active');
    document.getElementById('drawer-overlay').style.display = 'none';
}

async function executeOrder() {
    const amount = document.getElementById('order-input').value;
    const symbol = document.getElementById('trade-token-symbol-main').innerText.replace('$', '');
    
    if (!amount || amount <= 0) {
        tg.showAlert("Please enter a valid amount.");
        return;
    }

    // Ici on enverra l'ordre au backend plus tard
    tg.showConfirm(`Confirm ${currentOrderType} of ${amount} WPT worth of ${symbol}?`, (yes) => {
        if (yes) {
            tg.showAlert("Order executed successfully! (Simulated)");
            closeOrder();
            refresh(); // Pour mettre à jour le solde
        }
    });
}
