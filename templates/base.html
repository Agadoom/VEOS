function showPage(pageId) {
    // 1. CACHER TOUTES LES PAGES
    // On cherche tous les éléments avec la classe 'page' et on les masque
    document.querySelectorAll('.page').forEach(p => {
        p.style.display = 'none';
        p.classList.remove('active-page');
    });

    // 2. AFFICHER LA PAGE DEMANDÉE
    const target = document.getElementById(pageId);
    if (target) {
        target.style.display = 'block';
        target.classList.add('active-page');
        
        // Petit effet de scroll vers le haut quand on change de page
        window.scrollTo(0, 0);
    } else {
        console.error("La page " + pageId + " n'existe pas dans le HTML !");
        return;
    }

    // 3. METTRE À JOUR LA BARRE DE NAVIGATION (Icônes)
    document.querySelectorAll('.n-i').forEach(icon => icon.classList.remove('active'));
    
    // On détermine quelle icône doit être allumée
    // Si c'est p-details, on allume l'icône du launcher (fusée)
    let navId = "";
    if (pageId === 'p-details') {
        navId = 'n-launcher';
    } else {
        navId = pageId.replace('p-', 'n-');
    }
    
    const activeIcon = document.getElementById(navId);
    if (activeIcon) {
        activeIcon.classList.add('active');
    }

    // 4. CHARGEMENT DYNAMIQUE DES DONNÉES (Le plus important !)
    // On ne charge les données que si l'utilisateur est sur la page concernée
    switch(pageId) {
        case 'p-launcher':
            if (typeof loadMarket === "function") loadMarket();
            break;
        case 'p-profil':
            if (typeof loadLeaderboard === "function") loadLeaderboard();
            if (typeof loadPortfolio === "function") loadPortfolio();
            break;
        case 'p-lottery':
            if (typeof loadLottery === "function") loadLottery();
            break;
        case 'p-wallet':
            // Rafraîchir le solde WPT quand on ouvre le wallet
            if (typeof refresh === "function") refresh();
            break;
    }

    // 5. RETOUR HAPTIQUE (Vibration Telegram)
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
    }
}







    // Fonction de rafraîchissement (Remplit le Rank et les Scores)
  async function refresh() {
    if (!uid) return;
    try {
        const r = await fetch(`${BASE_URL}/api/user/${uid}`);
        if (!r.ok) return;
        const d = await r.json(); 

        // --- 1. FONCTION HELPER POUR ÉVITER LES ERREURS ---
        const update = (id, val) => {
            const el = document.getElementById(id);
            if (el) {
                // Si c'est un nombre, on le formate, sinon on affiche tel quel
                el.innerText = isNaN(val) ? (val || "---") : parseFloat(val || 0).toLocaleString(undefined, {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            }
        };

        // --- 2. MISE À JOUR DES SOLDES (WALLET & MINE) ---
        update('tot', d.score);           // Gros compteur page Mine
        update('wallet-balance', d.score); // Gros chiffre page Wallet
        update('user-balance', d.score);   // Autre ID si utilisé
        
        // Sous-jetons
        update('gv', d.g); 
        update('uv', d.u); 
        update('vv', d.v); 

        // --- 3. CALCUL DU NET WORTH (PROFIL) ---
        // Cette fonction va remplir la liste des assets et le total USD ($40,05)
        if (typeof updateProfilUI === "function") {
            updateProfilUI(d); 
        }

        // --- 4. RANG, ÉNERGIE & INFOS ---
        if (document.getElementById('prof-rank')) {
            document.getElementById('prof-rank').innerText = "RANK: #" + (d.rank || "---");
        }

        if (document.getElementById('e-f')) {
            document.getElementById('e-f').style.width = (d.energy || 0) + "%";
            document.getElementById('e-t').innerText = `Energy: ${Math.floor(d.energy || 0)}/100`;
        }
        
        if (document.getElementById('prof-name')) {
            document.getElementById('prof-name').innerText = d.name || "Citizen";
        }

        if (document.getElementById('prof-initials') && d.name) {
            document.getElementById('prof-initials').innerText = d.name.charAt(0).toUpperCase();
        }

    } catch (e) {
        console.error("❌ Erreur de rafraîchissement :", e);
    }
}













    // Fonction de Minage (Le clic sur le bouton ou la pièce)
    async function mine(type, event) {
        // Empêche le clignotement bleu bizarre du navigateur
        if (event) event.preventDefault(); 
        
        try {
            const r = await fetch(`${BASE_URL}/api/mine`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: uid, token_type: type })
            });
            const res = await r.json();
            
            if (res.ok) {
                refresh(); // On recharge les scores après le clic
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            } else {
                tg.showAlert(res.error || "Énergie vide !");
            }
        } catch (e) { console.error("Erreur mine:", e); }
    }








async function loadMarket() {
    try {
        const r = await fetch(`${BASE_URL}/api/launcher/market`);
        const tokens = await r.json();
        const list = document.getElementById('token-list');
        
        if (tokens.length === 0) {
            list.innerHTML = "<p style='text-align:center; opacity:0.5;'>No tokens launched yet.</p>";
            return;
        }

        list.innerHTML = tokens.map(t => `
            <div class="card" onclick="openDetails('${t.symbol}')" style="cursor:pointer; transition: 0.2s;">
                <div style="display:flex; align-items:center; gap:12px;">
                    <img src="${t.logo || '/static/genesis.png'}" style="width:45px; height:45px; border-radius:12px; object-fit:cover; border: 1px solid #333;">
                    <div>
                        <b style="font-size:15px;">${t.name}</b><br>
                        <small style="color:var(--gold); font-weight:900;">$${t.symbol}</small>
                    </div>
                </div>
                <div style="text-align:right;">
                    <b style="color:var(--green); font-family:monospace;">${parseFloat(t.price).toFixed(4)} WPT</b><br>
                    <small style="opacity:0.5; font-size:10px;">MCap: $${Math.floor(t.mcap || 0).toLocaleString()}</small>
                </div>
            </div>
        `).join('');
    } catch (e) { console.error("Market Error", e); }
}

async function openDetails(symbol) {
    showPage('p-details');
    window.scrollTo(0,0);
    
    try {
        const r = await fetch(`${BASE_URL}/api/launcher/token/${symbol}`);
        const t = await r.json();

        // On stocke l'ID interne du token dans l'attribut data-tid
        document.getElementById('p-details').setAttribute('data-tid', t.id);

        document.getElementById('det-name').innerText = t.name;
        document.getElementById('det-sym').innerText = "$" + t.symbol;
        document.getElementById('det-price-top').innerText = parseFloat(t.price).toFixed(6);
        document.getElementById('det-mcap').innerText = "$" + Math.floor(t.mcap || 0).toLocaleString();
        document.getElementById('det-desc').innerText = t.description || "No description.";
        document.getElementById('det-logo').src = t.logo || "/static/genesis.png";
        document.getElementById('det-banner').src = t.banner || "";
        
        // Label pour savoir ce qu'on achète
        document.getElementById('trade-label').innerText = t.symbol.toUpperCase();

    } catch (e) { tg.showAlert("Erreur de chargement."); }
}

// EXÉCUTER LE TRADE (Vraie version)
async function executeTrade(side) {
    const tid = document.getElementById('p-details').getAttribute('data-tid');
    const amount = document.getElementById('trade-amount').value;
    const symbol = document.getElementById('det-sym').innerText.replace('$', '');

    if (!amount || amount <= 0) return tg.showAlert("Saisis un montant valide !");

    // Vibration de confirmation
    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

    try {
        const endpoint = side === 'buy' ? '/api/launcher/swap' : '/api/launcher/sell';
        
        const r = await fetch(`${BASE_URL}${endpoint}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_id: uid,
                token_id: parseInt(tid),
                amount: parseFloat(amount)
            })
        });

        const res = await r.json();

        if (res.ok) {
            tg.showAlert(`✅ Succès ! ${side === 'buy' ? 'Achat' : 'Vente'} terminé.`);
            refresh(); // Met à jour ton solde WPT
            openDetails(symbol); // Rafraîchit les prix du token
        } else {
            tg.showAlert("❌ " + (res.error || "Erreur de transaction"));
        }
    } catch (e) {
        tg.showAlert("🚀 Connexion perdue avec le marché.");
    }
}

function openTrade(side) {
    const symbol = document.getElementById('det-sym').innerText.replace('$', '');

        // Note: showScanQrPopup est un détournement, l'idéal est un simple prompt ou un input sur la page
    });

    const amount = prompt(`Combien de ${symbol} voulez-vous ${side} ?`, "100");

// 2. ENVOIE L'ORDRE AU SERVEUR (API)
async function executeTrade(side, symbol, amount) {
    try {
        const endpoint = side === 'buy' ? '/api/launcher/swap' : '/api/launcher/sell';
        
        // On récupère l'ID du token (caché dans un attribut ou via une API)
        // Pour faire simple, on envoie le symbole et le serveur gère
        const r = await fetch(`${BASE_URL}${endpoint}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_id: uid,
                symbol: symbol, // Ton Python doit accepter 'symbol' ou tu dois stocker 'token_id'
                amount: amount
            })
        });

        const res = await r.json();
        if (res.ok) {
            tg.showAlert(`✅ Transaction réussie ! Reçu : ${res.received.toFixed(2)}`);
            refresh(); // Met à jour ton solde WPT
            openDetails(symbol); // Rafraîchit le prix sur la page détails
        } else {
            tg.showAlert("❌ Erreur : " + (res.error || "Transaction échouée"));
        }
    } catch (e) {
        tg.showAlert("🚀 Serveur occupé, réessayez...");
    }
}

        tg.showAlert("Impossible de contacter le serveur de paiement.");

// --- 1. CHARGER LE LEADERBOARD ---
async function loadLeaderboard() {
    const container = document.getElementById('leaderboard');
    if (!container) return;

    try {
        const r = await fetch(`${BASE_URL}/api/user/leaderboard`);
        const data = await r.json();

// --- 3. MISE À JOUR DU PROFIL DANS REFRESH ---
// Ajoute ceci dans ta fonction refresh() existante :
    function updateProfilUI(d) {
    // 1. Vérification de sécurité
    if (!d || !d.assets) return;

    let globalTotal = 0;
    const assetList = document.getElementById('asset-list');
    if (!assetList) return;

    assetList.innerHTML = ''; // Reset de la liste

    // 2. Boucle sur les assets reçus du serveur
    d.assets.forEach(asset => {
        const assetValue = asset.balance * asset.current_price;
        globalTotal += assetValue;

        const isPositive = asset.change_24h >= 0;
        const changeClass = isPositive ? 'profit' : 'loss';
        const changeSign = isPositive ? '+' : '';

        assetList.innerHTML += `
            <div class="asset-card" onclick="showTokenDetails('${asset.symbol}')">
                <div class="asset-info">
                    <img src="${asset.icon}" alt="${asset.name}" style="width:35px; border-radius:50%;">
                    <div>
                        <h4 style="margin:0;">${asset.name}</h4>
                        <small style="opacity:0.6;">${asset.balance.toLocaleString()} ${asset.symbol}</small>
                    </div>
                </div>
                <div class="asset-stats" style="text-align: right;">
                    <p style="margin:0; font-weight:bold;">$${assetValue.toFixed(2)}</p>
                    <small class="${changeClass}">${changeSign}${asset.change_24h}%</small>
                </div>
            </div>
        `;
    });

    // 3. Mise à jour du GROS TOTAL ($40,05)
    const totalEl = document.getElementById('total-net-worth');
    if (totalEl) {
        totalEl.innerText = `$${globalTotal.toFixed(2).replace('.', ',')}`;
    }

    // 4. Bonus : Mettre à jour d'autres infos profil si elles existent
    if (d.username && document.getElementById('prof-name')) {
        document.getElementById('prof-name').innerText = d.username;
    }
}







// VARIABLES GLOBALES POUR LES IMAGES
let lastUploadedLogo = "";
let lastUploadedBanner = "";

// GESTION DES FICHIERS (LOGO/BANNER)
async function processFile(type) {
    const fileInput = document.getElementById('f-' + type);
    const label = document.getElementById('label-' + type);
    if (!fileInput.files[0]) return;

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    try {
        label.innerText = "⏳ Upload...";
        const r = await fetch(`${BASE_URL}/api/upload`, { method: 'POST', body: formData });
        const d = await r.json();
        if (d.url) {
            if (type === 'logo') lastUploadedLogo = d.url;
            else lastUploadedBanner = d.url;
            label.innerText = "✅ Done";
            label.style.color = "var(--gold)";
        }
    } catch (e) { label.innerText = "❌ Error"; }
}

// DÉPLOYER LE TOKEN
async function deployToken() {
    const name = document.getElementById('tk-name').value;
    const symbol = document.getElementById('tk-sym').value;
    const desc = document.getElementById('tk-desc').value;
    const website = document.getElementById('tk-url').value;
    const twitter = document.getElementById('tk-x').value;

    if (!name || !symbol) return tg.showAlert("Name and Symbol are required!");

    try {
        const r = await fetch(`${BASE_URL}/api/launcher/deploy`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                user_id: uid,
                name: name,
                symbol: symbol,
                description: desc,
                website: website,
                twitter: twitter,
                logo: lastUploadedLogo,
                banner: lastUploadedBanner
            })
        });
        const res = await r.json();
        if (res.ok) {
            tg.showAlert("🚀 Token successfully launched!");
            showPage('p-launcher');
            loadMarket();
            refresh(); // Pour déduire les 5000 WPT
        } else {
            tg.showAlert(res.error || "Launch failed.");
        }
    } catch (e) { tg.showAlert("Connection error."); }
}

async function loadLottery() {

        if (resStats.ok) {
            const d = await resStats.json();
            const jackEl = document.getElementById('jackpot-amount');
            if (jackEl) jackEl.innerText = parseFloat(d.jackpot || 0).toLocaleString();
            
            if (document.getElementById('last-winner')) 
                document.getElementById('last-winner').innerText = d.last_winner || "@NoOne";
            if (document.getElementById('last-win-amount')) 
                document.getElementById('last-win-amount').innerText = parseFloat(d.last_prize || 0).toLocaleString() + " WPT";
        }

        // B. Tes Tickets personnels
        const resUser = await fetch(`${BASE_URL}/api/lottery/user-tickets/${uid}`);
        if (resUser.ok) {
            const du = await resUser.json();
            const myTicketsEl = document.getElementById('user-tickets-count');
            if (myTicketsEl) myTicketsEl.innerText = du.count || 0;
        }
    } catch (e) { console.error("Erreur Synchro Loterie :", e); }
}

// --- 2. GESTION QUANTITÉ (+ / -) ---
function changeQty(delta) {
    const input = document.getElementById('ticket-qty');
    const costDisplay = document.getElementById('total-cost');
    if (!input || !costDisplay) return;

    let val = parseInt(input.value) + delta;
    if (val < 1) val = 1; 
    
    input.value = val;
    costDisplay.innerText = (val * ticketPrice).toLocaleString();

    if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
}

// --- 3. L'ACHAT (FONCTION CORRIGÉE) ---
async function buyTicket() {
    const qtyInput = document.getElementById('ticket-qty');
    const qty = qtyInput ? parseInt(qtyInput.value) : 1;
    const userId = tg.initDataUnsafe?.user?.id || uid;

    try {
        const r = await fetch(`${BASE_URL}/api/lottery/buy-ticket`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_id: userId,
                quantity: qty
            })
        });

        const res = await r.json();

        if (res.ok) {
            tg.showAlert("🎟️ Bonne chance ! Tickets achetés.");
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            refresh();      // Met à jour ton solde (les 400k)
            loadLottery();  // Met à jour le jackpot et tes tickets
        } else {
            tg.showAlert("❌ " + (res.error || "Erreur inconnue"));
        }
    } catch (e) {
        console.error(e);
        tg.showAlert("❌ Erreur de connexion API");
    }
}

// --- INITIALISATION TON CONNECT (CORRIGÉE) ---
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    // L'URL doit être UNIQUEMENT le lien vers ton fichier, sans texte autour
    manifestUrl: 'https://veos-production-a2de.up.railway.app/tonconnect-manifest.json',
    buttonRootId: 'ton-connect-btn'
});

async function handleWalletConnection() {
    try {
        // On vérifie si l'utilisateur est déjà connecté
        const connectedWallet = await tonConnectUI.connectWallet();
        
        if (connectedWallet) {
            // L'adresse TON arrive souvent en format brut (hex), on la récupère
            const walletAddress = connectedWallet.account.address;
            const walletName = connectedWallet.device.appName;

            console.log("Wallet Connected:", walletAddress);

            // Envoi au backend Railway
            const response = await fetch(`${BASE_URL}/api/user/link-wallet`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: uid, 
                    wallet_address: walletAddress,
                    wallet_type: walletName
                })
            });

            const result = await response.json();
            if (result.ok) {
                tg.showAlert("💎 Wallet Linked Successfully!");
            }
        }
    } catch (error) {
        console.error("Connection failed", error);
    }
}


// 1. SAUVEGARDER L'ADRESSE TON
async function saveTonAddress() {
    const addr = document.getElementById('ton-address').value;
    if(!addr) return tg.showAlert("Please enter an address!");
    
    const r = await fetch(`${BASE_URL}/api/user/update-wallet`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: uid, wallet_address: addr })
    });
    const d = await r.json();
    if(d.ok) tg.showAlert("✅ Wallet Address Saved!");
}

// 2. EXECUTER LE BURN
async function executeBurn() {
    const amount = document.getElementById('burn-amount').value;
    if(!amount || amount <= 0) return tg.showAlert("Enter a valid amount to sacrifice!");
    
    tg.showConfirm(`Are you sure you want to BURN ${amount} WPT forever? 🔥`, async (ok) => {
        if(ok) {
            const r = await fetch(`${BASE_URL}/api/admin/burn`, { // Route à adapter selon ton Python
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: uid, amount: amount })
            });
            const d = await r.json();
            if(d.ok) {
                tg.showAlert("🔥 SACRIFICE ACCEPTED! Scarcity increased.");
                refresh();
            }
        }
    });
}





// --- 🔥 FONCTION DE SACRIFICE (BURN) ---
async function executeBurn() {
    const burnInput = document.getElementById('burn-amount');
    const amount = parseFloat(burnInput.value);

    // 1. Vérifications de sécurité
    if (!amount || amount <= 0) {
        return tg.showAlert("Please enter a valid amount of WPT to sacrifice! 🔥");
    }

    // 2. Fenêtre de confirmation Telegram
    tg.showConfirm(`WARNING: You are about to BURN ${amount.toLocaleString()} WPT forever. This action is irreversible and will increase token scarcity. Do you accept the sacrifice?`, async (ok) => {
        if (ok) {
            try {
                // On montre un petit loader ou on désactive le bouton
                tg.MainButton.setText("BURNING IN PROGRESS...");
                tg.MainButton.showProgress();

                const response = await fetch(`${BASE_URL}/api/user/burn`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: uid,
                        amount: amount
                    })
                });

                const result = await response.json();

                if (result.ok) {
                    // Succès !
                    tg.showAlert(`🔥 SACRIFICE ACCEPTED!\n\n${amount.toLocaleString()} WPT have been destroyed. Global scarcity increased!`);
                    burnInput.value = ''; // On vide le champ
                    refresh(); // On actualise les soldes et le prix
                } else {
                    tg.showAlert("❌ Error: " + (result.error || "Insufficient balance."));
                }
            } catch (error) {
                console.error("Burn error:", error);
                tg.showAlert("❌ Connection failed. The fire is out!");
            } finally {
                tg.MainButton.hideProgress();
            }
        }
    });
}

    window.onload = () => {
