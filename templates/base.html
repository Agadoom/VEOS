<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One World Peace Coins</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold: #FFD700;
            --purple: #A259FF;
            --bg: #000000;
            --card-bg: #0a0a0b;
            --text: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-user-select: none;
        }

        /* --- STYLES GENERAUX --- */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .active-page { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #1a1a1c;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn {
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }

        .l-input {
            background: #111;
            border: 1px solid #333;
            color: white;
            padding: 10px;
            border-radius: 10px;
            outline: none;
        }

        /* --- NAVIGATION BASSE --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: rgba(10, 10, 11, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #1a1a1c;
            z-index: 1000;
        }

        .nav-item {
            text-align: center;
            opacity: 0.5;
            transition: 0.3s;
            cursor: pointer;
        }
        .nav-item.active {
            opacity: 1;
            color: var(--gold);
        }
        .nav-item span { font-size: 20px; display: block; }
        .nav-item small { font-size: 10px; font-weight: 700; text-transform: uppercase; }

        /* --- ANIMATIONS --- */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(162, 89, 255, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(162, 89, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(162, 89, 255, 0); }
        }

        .main-coin {
            transition: transform 0.1s;
        }
        .main-coin:active { transform: scale(0.9); }

        .spinner {
            width: 30px; height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }



/* Animation de l'onde bleue au clic */
.mine-ripple {
    position: absolute;
    border: 2px solid #00d2ff;
    background: rgba(0, 210, 255, 0.2);
    border-radius: 50%;
    pointer-events: none;
    transform: scale(0);
    animation: ripple-out 0.6s ease-out;
    z-index: 99;
}

@keyframes ripple-out {
    to {
        transform: scale(4);
        opacity: 0;
    }
}

/* Effet de lueur bleue sur la pièce au clic */
.main-coin:active {
    transform: scale(0.92);
    filter: drop-shadow(0 0 30px #00d2ff) brightness(1.2);
    transition: 0.1s;
}

/* Style des petits "+0.05" qui montent en bleu */
.floating-reward {
    position: absolute;
    color: #00d2ff;
    font-weight: 900;
    font-size: 20px;
    pointer-events: none;
    animation: float-up 0.8s forwards;
    text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
    z-index: 100;
}

@keyframes float-up {
    to {
        transform: translateY(-100px) scale(1.2);
        opacity: 0;
    }
}

    </style>
</head>
<body>

    <div id="app-content" style="padding-bottom: 90px;">
        {% block content %}{% endblock %}
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="showPage('p-mine', this)">
            <span>⛏️</span><small>Mine</small>
        </div>
        <div class="nav-item" onclick="showPage('p-launcher', this)">
            <span>🚀</span><small>Launcher</small>
        </div>
        <div class="nav-item" onclick="showPage('p-trade', this)">
            <span>📈</span><small>Trade</small>
        </div>
        <div class="nav-item" onclick="showPage('p-wallet', this)">
            <span>💼</span><small>Wallet</small>
        </div>
        <div class="nav-item" onclick="showPage('p-profil', this)">
            <span>👤</span><small>Profil</small>
        </div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        const BASE_URL = "https://veos-production-a2de.up.railway.app";









        // LOGIQUE DE NAVIGATION ENTRE LES PAGES
        function showPage(pageId, navElement) {
            // Cacher toutes les pages
            document.querySelectorAll('.page').forEach(p => {
                p.classList.remove('active-page');
            });
            // Afficher la page sélectionnée
            document.getElementById(pageId).classList.add('active-page');

            // Gérer l'état actif de la navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            navElement.classList.add('active');

            // Petit retour haptique Telegram
            tg.HapticFeedback.selectionChanged();
        }









        // --- TES FONCTIONS JS (A relier à ton backend) ---
        function mine(type, event) {
    // 1. Retour Haptique
    tg.HapticFeedback.impactOccurred('medium');

    // 2. Création de l'onde bleue (Ripple)
    const coinContainer = document.querySelector('.coin-container');
    const ripple = document.createElement('div');
    ripple.className = 'mine-ripple';
    
    // Positionner au centre du clic ou de la pièce
    const rect = coinContainer.getBoundingClientRect();
    ripple.style.left = (event.clientX - rect.left - 25) + 'px';
    ripple.style.top = (event.clientY - rect.top - 25) + 'px';
    ripple.style.width = '50px';
    ripple.style.height = '50px';
    
    coinContainer.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);

    // 3. Affichage du texte flottant bleu
    const reward = document.createElement('div');
    reward.className = 'floating-reward';
    reward.innerText = '+0.05'; // Tu peux dynamiser avec data.reward plus tard
    reward.style.left = (event.clientX - rect.left) + 'px';
    reward.style.top = (event.clientY - rect.top) + 'px';
    
    coinContainer.appendChild(reward);
    setTimeout(() => reward.remove(), 800);

    // 4. Appel API au serveur (ton mine.py)
    sendMineRequest(type);
}





        function buyStarsPack(amount) {
            console.log("Achat stars :", amount);
            // Fonction déjà vue hier
        }
    </script>
</body>
</html>
