async function updateBurnStats() {
    try {
        const r = await fetch(`${BASE_URL}/api/launcher/total-burned`);

    // --- NAVIGATION ---
    function showPage(pageId) {
    // 1. Gestion de l'affichage des pages
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
    const target = document.getElementById(pageId);
    if(target) target.classList.add('active-page');

    // 2. Gestion des icônes de la barre de navigation
    document.querySelectorAll('.n-i').forEach(ni => ni.classList.remove('active'));
    const navId = pageId.replace('p-', 'n-');
    const navIcon = document.getElementById(navId);
    if(navIcon) navIcon.classList.add('active');

    // 3. DÉCLENCHEURS DE CHARGEMENT (API)
    // On rafraîchit les données selon la page pour éviter de charger pour rien
    if(pageId === 'p-mine' || pageId === 'p-profil') { 
        refresh(); 
        if(pageId === 'p-profil') { loadLeaderboard(); loadPortfolio(); }
    }
    
    if(pageId === 'p-launcher') {
        loadMarket();
    }

    if(pageId === 'p-lottery') { updateLotteryUI(); } // Utilise UI au lieu de Info

    if(pageId === 'p-wallet') {
        refresh(); // Pour être sûr que le solde WPT est à jour avant d'acheter
    }
    
    // 4. Retour haptique Telegram
    if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}


    // --- REFRESH DATA ---
    async function refresh() {
    if (!uid) return;
    try {
        // Petit ping de sync pour le minage
        fetch(`${BASE_URL}/api/mine/sync/${uid}`).catch(() => {});
        
        const r = await fetch(`${BASE_URL}/api/user/${uid}`);
        if (!r.ok) return;
        const d = await r.json();

        const safeSet = (id, val) => {
            const el = document.getElementById(id);
            if (el) el.innerText = val;
        };

        // --- 1. IDENTITÉ (Ce qui te manquait !) ---
        const name = d.first_name || d.name || "CITIZEN";
        safeSet('prof-name', name.toUpperCase());
        
        const initialEl = document.getElementById('prof-initials');
        if (initialEl) initialEl.innerText = name.charAt(0).toUpperCase();
        
        safeSet('prof-rank', `RANK: #${d.rank || '---'}`);

        // --- 2. SOLDES ---
        safeSet('tot', parseFloat(d.score || 0).toLocaleString());
        safeSet('gv', parseFloat(d.g || 0).toLocaleString());
        safeSet('uv', parseFloat(d.u || 0).toLocaleString());
        safeSet('vv', parseFloat(d.v || 0).toLocaleString());
        
        // Stockage du solde global pour le calcul du Portfolio
        window.userWptBalance = parseFloat(d.g || 0);

        // --- 3. ENERGIE ---
        const eBar = document.getElementById('e-f');
        const eText = document.getElementById('e-t');
        if (eBar && d.max_energy) {
            const percent = (d.energy / d.max_energy) * 100;
            eBar.style.width = percent + "%";
            if(eText) eText.innerText = `Energy: ${Math.floor(d.energy)}/${d.max_energy}`;
        }

        // --- 4. MULTIPLIER ---
        const m = parseFloat(d.multiplier || 1.0);
        safeSet('mining-multiplier', m.toFixed(1));
        safeSet('mining-multiplier-prof', `x${m.toFixed(1)}`);

        // --- 5. WALLET BALANCE (Pour la page Wallet) ---
        safeSet('wallet-balance', parseFloat(d.g || 0).toLocaleString());

    } catch (e) { 
        console.error("Refresh Error:", e); 
    }
}

async function mine(type, event) {
    if (!uid) {
        console.error("UID manquant");
        return;
    }

    try {
        // 1. Appel API (On envoie juste l'ID et le Type, le serveur fait le reste)
        const response = await fetch(`${BASE_URL}/api/mine`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                user_id: uid, 
                token_type: type // "genesis", "unity" ou "veo"
            })
        });

        const res = await response.json();

        if (res.ok) {
    // Force l'affichage du badge si le serveur confirme le multiplier > 1
    if (res.multiplier > 1) {
        document.getElementById('boost-badge').style.display = 'inline-flex';
        document.getElementById('mining-multiplier').innerText = res.multiplier.toFixed(1);
}
            // --- ANIMATION DU TEXTE FLOTTANT ---
            const x = event.clientX || (event.touches ? event.touches[0].clientX : 0);
            const y = event.clientY || (event.touches ? event.touches[0].clientY : 0);
            
            const ft = document.createElement('div');
            ft.className = 'floating-text';
            ft.innerText = "+" + parseFloat(res.reward).toFixed(2);
            ft.style.left = x + "px";
            ft.style.top = (y - 40) + "px";
            document.body.appendChild(ft);
            setTimeout(() => ft.remove(), 800);

            // Vibreur Telegram
            if (window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }

            // --- MISE À JOUR LOCALE ---
            // On met à jour l'énergie avec la valeur exacte renvoyée par le serveur
            const eBar = document.getElementById('e-f');
            if (eBar) {
                const percent = (res.new_energy / 100) * 100; // 100 = MAX_ENERGY
                eBar.style.width = percent + "%";
            }
            const eText = document.getElementById('e-t');
            if (eText) eText.innerText = `Energy: ${res.new_energy}/100`;

            // On rafraîchit les soldes
            refresh(); 

        } else {
            console.warn("API Error:", res.error);
            if (res.error.includes("Insufficient") || res.error.includes("Low energy")) {
                window.Telegram.WebApp.showAlert("🪫 No energy left! Wait for recharge.");
            }
        }

    } catch (e) {
        console.error("❌ Erreur réseau Minage:", e);
    }
}

async function setFilter(mode, el) {
    currentFilter = mode;

async function loadMarket() {
    const list = document.getElementById('token-list');
    if (!list) return;
    
    const searchQuery = document.getElementById('token-search')?.value || "";
    
    try {
        const url = `${BASE_URL}/api/launcher/list?q=${encodeURIComponent(searchQuery)}&filter=${currentFilter}&uid=${uid}`;
        const r = await fetch(url);
        
        // Sécurité : si le serveur est en erreur
        if (!r.ok) throw new Error("Server Down");
        
        const tokens = await r.json();
        list.innerHTML = ""; // On vide proprement

        if (!tokens || tokens.length === 0) {
            list.innerHTML = "<p style='text-align:center; opacity:0.5; margin-top:20px;'>No tokens found.</p>";
            return;
        }

        tokens.forEach(t => {
            const card = document.createElement('div');
            card.className = "card";
            card.style.cursor = "pointer";
            
            // --- FIX CRITIQUE : On attache l'événement proprement ---
            card.onclick = () => {
                if(typeof openTokenDetails === 'function') {
                    openTokenDetails(t);
                }
            };

            card.innerHTML = `
                <div style="display:flex; align-items:center; gap:12px; pointer-events:none;">
                    <img src="${t.logo || ''}" style="width:45px; height:45px; border-radius:12px; object-fit:cover; background:#222;">
                    <div style="text-align:left;">
                        <b style="display:block;">${t.name || 'Unnamed'}</b>
                        <small style="color:var(--gold)">$${t.symbol || 'TKN'}</small>
                    </div>
                </div>
                <div style="text-align:right; pointer-events:none;">
                    <b style="color:var(--green); display:block;">${parseFloat(t.price || 0.0001).toFixed(6)}</b>
                    <small style="font-size:9px; opacity:0.5;">${currentFilter === 'hot' ? '🔥 HOT' : ''}</small>
                </div>
            `;
            list.appendChild(card);
        });
        
        console.log("✅ Market loaded successfully");
    } catch(e) { 
        console.error("Market error:", e);
        list.innerHTML = "<p style='text-align:center; color:red;'>Sync Error 📡</p>";
    }
}

async function openTokenDetails(t) {

    const fill = (id, val) => {

    };
    
    // 2. Remplissage des images (Logo & Banner)
    const imgLogo = document.getElementById('det-logo');

    if (imgLogo) imgLogo.src = t.logo || "https://via.placeholder.com/100";
    if (imgBanner) imgBanner.src = t.banner || "https://via.placeholder.com/400x180";

    if (socialDiv) {

        if (web && web.length > 5) {

            socialDiv.innerHTML += `<a href="${wUrl}" target="_blank" style="text-decoration:none; font-size:24px; filter: drop-shadow(0 0 5px gold);">🌐</a>`;

    try {

    }, 100);

    if (refEl) {
        refEl.innerText = `https://t.me/OWPCsBot?start=${uid}_${t.id}`;
    }
}






function drawMiniChart(price) {
    const canvas = document.getElementById('token-chart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    // Nettoyage
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Création de points fictifs basés sur le prix pour la "vibe"
    ctx.beginPath();
    ctx.strokeStyle = '#4caf50';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    
    let x = 0;
    let y = canvas.height / 2;
    ctx.moveTo(x, y);

    for (let i = 1; i <= 10; i++) {
        x += canvas.width / 10;
        y += (Math.random() - 0.5) * 40; // Simulation de mouvement
        if (y < 10) y = 10;
        if (y > canvas.height - 10) y = canvas.height - 10;
        ctx.lineTo(x, y);
    }
    ctx.stroke();
    
    // Gradient sous la courbe
    ctx.lineTo(canvas.width, canvas.height);
    ctx.lineTo(0, canvas.height);
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, 'rgba(76, 175, 80, 0.2)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fill();
}








// GESTION DU TRADE
function openTrade(type) {
    currentTradeType = type;
    document.getElementById('trade-modal').style.display = 'flex';
    document.getElementById('modal-title').innerText = type === 'buy' ? '🚀 BUY TOKEN' : '📉 SELL TOKEN';
    document.getElementById('trade-amount').value = "";
    if (window.tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

function closeTrade() {
    document.getElementById('trade-modal').style.display = 'none';
}

async function executeTrade() {
    const val = parseFloat(document.getElementById('trade-amount').value);
    const tid = window.currentTokenId;

    if (!val || val <= 0) return tg.showAlert("Please enter a valid amount");
    
    // On utilise currentTradeType (défini par openTrade)
    const path = (currentTradeType === 'buy') ? '/api/launcher/buy' : '/api/launcher/sell';
    
    try {
        const response = await fetch(BASE_URL + path, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_id: uid, // Pas de parseInt ici, laisse l'ID tel quel
                token_id: tid,
                amount: val
            })
        });

        const res = await response.json();
        if (response.ok) {
            tg.showAlert("✅ Transaction Successful!");
            closeTrade();
            refresh(); 
            if(currentTradeType === 'sell') loadPortfolio(); // Rafraîchit ton profil
        } else {
            tg.showAlert("❌ Error: " + (res.error || "Transaction failed"));
        }
    } catch (e) {
        tg.showAlert("❌ Network Error. Check Railway logs.");
    }
}
