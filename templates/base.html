<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPT Network</title>
    <style>
        /* --- TON CSS (L'HABIT DE L'APP) --- */
        :root { --gold: #FFD700; --text: #eee; }
        body { background: #000; color: white; font-family: sans-serif; margin: 0; }
        .container { padding: 20px; padding-bottom: 80px; }
        .page { display: none; } /* On cache tout par défaut */
        .active-page { display: block; } /* On affiche la page active */
        .card { background: #111; border: 1px solid #333; padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .nav { position: fixed; bottom: 0; width: 100%; background: #050505; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
        .btn { background: var(--gold); border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        /* Ajoute ici le reste de ton CSS si besoin */
    </style>
</head>
<body>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <nav class="nav">
        <div onclick="showPage('p-mine')">🏠</div>
        <div onclick="showPage('p-launcher')">🚀</div>
        <div onclick="showPage('p-lottery')">🎟️</div>
        <div onclick="showPage('p-wallet')">💼</div>
        <div onclick="showPage('p-profil')">👤</div>
    </nav>

    <script>
        // --- TA LOGIQUE (LE CERVEAU) ---
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            const target = document.getElementById(pageId);
            if(target) target.classList.add('active-page');
        }
        // Ajoute ici tes fonctions mine(), refresh(), etc.
    </script>
</body>
</html>
