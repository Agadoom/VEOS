<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>One World Peace Coins</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #FFD700; --purple: #A259FF; --green: #34C759; --red: #FF3B30; --bg: #000; --card: #111; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; margin: 0; overflow-x: hidden; }
        .container { padding: 15px; padding-bottom: 100px; max-width: 500px; margin: auto; min-height: 100vh; }
        
        /* Navigation & Pages */
        .page { display: none; animation: fadeIn 0.3s ease; }
        .active-page { display: block !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* UI Elements */
        .card { background: linear-gradient(145deg, #1a1a1c, #0a0a0b); border: 1px solid #333; padding: 15px; border-radius: 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn { background: var(--gold); color: black; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .l-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #333; background: #000; color: white; margin-bottom: 8px; box-sizing: border-box; }

        /* Nav Bar */
        .nav { position: fixed; bottom: 0; width: 100%; background: rgba(5,5,5,0.95); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; backdrop-filter: blur(10px); z-index: 9999; }
        .n-i { font-size: 24px; opacity: 0.4; transition: 0.3s; cursor: pointer; }
        .n-i.active { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 8px var(--gold)); }
        
        .ticker { background: var(--gold); color: black; font-size: 10px; font-weight: 900; padding: 5px 0; text-align: center; text-transform: uppercase; }


* {
    -webkit-tap-highlight-color: transparent; /* Enlève le flash bleu */
    outline: none;
}

img, button {
    user-select: none;
    -webkit-user-drag: none;
}

    </style>
</head>
<body>
    <div class="ticker">🏆 NETWORK ACTIVE ● TRADING ENABLED ● MINE WPT</div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <nav class="nav">
        <div onclick="showPage('p-mine')" id="n-mine" class="n-i active">🏠</div>
        <div onclick="showPage('p-launcher')" id="n-launcher" class="n-i">🚀</div>
        <div onclick="showPage('p-lottery')" id="n-lottery" class="n-i">🎰</div>
        <div onclick="showPage('p-wallet')" id="n-wallet" class="n-i">💼</div>
        <div onclick="showPage('p-profil')" id="n-profil" class="n-i">👤</div>
    </nav>

    <script>
    const tg = window.Telegram.WebApp;
    // CRITIQUE : Récupérer l'ID réel de l'utilisateur Telegram
    const uid = tg.initDataUnsafe?.user?.id || 12345; 
    const BASE_URL = window.location.origin;

    // Fonction de rafraîchissement (Remplit le Rank et les Scores)
    async function refresh() {
        if (!uid) return;
        try {
            const r = await fetch(`${BASE_URL}/api/user/${uid}`);
            if (!r.ok) return;
            const d = await r.json();

            // Mise à jour des textes
            document.getElementById('tot').innerText = parseFloat(d.score || 0).toLocaleString();
            document.getElementById('gv').innerText = parseFloat(d.g || 0).toLocaleString();
            document.getElementById('uv').innerText = parseFloat(d.u || 0).toLocaleString();
            document.getElementById('vv').innerText = parseFloat(d.v || 0).toLocaleString();
            
            // Mise à jour du RANK (C'est ça qui te manque !)
            if (d.rank) {
                document.getElementById('prof-rank').innerText = "RANK: #" + d.rank;
            }

            // Énergie
            if (document.getElementById('e-f')) {
                document.getElementById('e-f').style.width = (d.energy || 0) + "%";
            }
            document.getElementById('e-t').innerText = "Energy: " + Math.floor(d.energy || 0) + "/100";

        } catch (e) { console.error("Erreur de synchro:", e); }
    }

    // Fonction de Minage (Le clic sur le bouton ou la pièce)
    async function mine(type, event) {
        // Empêche le clignotement bleu bizarre du navigateur
        if (event) event.preventDefault(); 
        
        try {
            const r = await fetch(`${BASE_URL}/api/mine`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: uid, token_type: type })
            });
            const res = await r.json();
            
            if (res.ok) {
                refresh(); // On recharge les scores après le clic
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            } else {
                tg.showAlert(res.error || "Énergie vide !");
            }
        } catch (e) { console.error("Erreur mine:", e); }
    }


function showPage(pageId) {
    // 1. CACHER TOUTES LES PAGES
    // On cherche tous les éléments avec la classe 'page' et on les masque
    document.querySelectorAll('.page').forEach(p => {
        p.style.display = 'none';
        p.classList.remove('active-page');
    });

    // 2. AFFICHER LA PAGE DEMANDÉE
    const target = document.getElementById(pageId);
    if (target) {
        target.style.display = 'block';
        target.classList.add('active-page');
        
        // Petit effet de scroll vers le haut quand on change de page
        window.scrollTo(0, 0);
    } else {
        console.error("La page " + pageId + " n'existe pas dans le HTML !");
        return;
    }

    // 3. METTRE À JOUR LA BARRE DE NAVIGATION (Icônes)
    document.querySelectorAll('.n-i').forEach(icon => icon.classList.remove('active'));
    
    // On détermine quelle icône doit être allumée
    // Si c'est p-details, on allume l'icône du launcher (fusée)
    let navId = "";
    if (pageId === 'p-details') {
        navId = 'n-launcher';
    } else {
        navId = pageId.replace('p-', 'n-');
    }
    
    const activeIcon = document.getElementById(navId);
    if (activeIcon) {
        activeIcon.classList.add('active');
    }

    // 4. CHARGEMENT DYNAMIQUE DES DONNÉES (Le plus important !)
    // On ne charge les données que si l'utilisateur est sur la page concernée
    switch(pageId) {
        case 'p-launcher':
            if (typeof loadMarket === "function") loadMarket();
            break;
        case 'p-profil':
            if (typeof loadLeaderboard === "function") loadLeaderboard();
            if (typeof loadPortfolio === "function") loadPortfolio();
            break;
        case 'p-lottery':
            if (typeof loadLottery === "function") loadLottery();
            break;
        case 'p-wallet':
            // Rafraîchir le solde WPT quand on ouvre le wallet
            if (typeof refresh === "function") refresh();
            break;
    }

    // 5. RETOUR HAPTIQUE (Vibration Telegram)
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
    }
}





async function loadMarket() {
    try {
        const r = await fetch(`${BASE_URL}/api/launcher/market`);
        const tokens = await r.json();
        const list = document.getElementById('token-list');
        
        if (tokens.length === 0) {
            list.innerHTML = "<p style='text-align:center; opacity:0.5;'>No tokens launched yet.</p>";
            return;
        }

        list.innerHTML = tokens.map(t => `
            <div class="card" onclick="openDetails('${t.symbol}')" style="cursor:pointer; transition: 0.2s;">
                <div style="display:flex; align-items:center; gap:12px;">
                    <img src="${t.logo || '/static/genesis.png'}" style="width:45px; height:45px; border-radius:12px; object-fit:cover; border: 1px solid #333;">
                    <div>
                        <b style="font-size:15px;">${t.name}</b><br>
                        <small style="color:var(--gold); font-weight:900;">$${t.symbol}</small>
                    </div>
                </div>
                <div style="text-align:right;">
                    <b style="color:var(--green); font-family:monospace;">${parseFloat(t.price).toFixed(4)} WPT</b><br>
                    <small style="opacity:0.5; font-size:10px;">MCap: $${Math.floor(t.mcap || 0).toLocaleString()}</small>
                </div>
            </div>
        `).join('');
    } catch (e) { console.error("Market Error", e); }
}

async function openDetails(symbol) {
    try {
        const r = await fetch(`${BASE_URL}/api/launcher/token/${symbol}`);
        const t = await r.json();

        // 1. Remplir les textes
        document.getElementById('det-name').innerText = t.name;
        document.getElementById('det-sym').innerText = "$" + t.symbol;
        document.getElementById('det-price-top').innerText = parseFloat(t.price).toFixed(6);
        document.getElementById('det-mcap').innerText = "$" + Math.floor(t.mcap || 0).toLocaleString();
        document.getElementById('det-desc').innerText = t.description || "No description.";
        
        // 2. Gérer les liens sociaux (Website & Twitter)
        const socialBox = document.getElementById('det-socials');
        socialBox.innerHTML = ""; // On vide
        
        if(t.website) {
            socialBox.innerHTML += `<a href="${t.website}" target="_blank" style="text-decoration:none;">🌐</a>`;
        }
        if(t.twitter) {
            const xUser = t.twitter.replace('@', '');
            socialBox.innerHTML += `<a href="https://x.com/${xUser}" target="_blank" style="text-decoration:none;">🚀</a>`;
        }

        // 3. Images
        if(t.logo) document.getElementById('det-logo').src = t.logo;
        if(t.banner) document.getElementById('det-banner').src = t.banner;

        showPage('p-details');
        
    } catch(e) { 
        console.error("Détails Error:", e);
        tg.showAlert("Impossible de charger les données du token.");
    }
}











// 1. CHARGER LES INFOS DE LA LOTERIE
async function loadLottery() {
    try {
        const r = await fetch(`${BASE_URL}/api/lottery/status`);
        const d = await r.json();
        
        document.getElementById('jackpot-amount').innerText = d.jackpot.toLocaleString();
        document.getElementById('last-winner').innerText = d.last_winner || "Attente...";
        document.getElementById('last-win-amount').innerText = (d.last_prize || 0).toLocaleString() + " WPT";
        
        // Charger tes propres tickets
        const ur = await fetch(`${BASE_URL}/api/user/${uid}/tickets`);
        const ud = await ur.json();
        document.getElementById('user-tickets').innerText = ud.count || 0;
        document.getElementById('win-chance').innerText = (ud.chance || 0) + "%";
        
    } catch (e) { console.error("Lottery error", e); }
}

// 2. ACHETER UN TICKET
async function buyLotteryTicket() {
    const qty = document.getElementById('ticket-qty').value || 1;
    try {
        const r = await fetch(`${BASE_URL}/api/lottery/buy`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: uid, amount: qty })
        });
        const res = await r.json();
        
        if (res.ok) {
            tg.showAlert(`🎟️ ${qty} Ticket(s) acheté(s) ! Bonne chance Boss.`);
            loadLottery(); // Refresh les stats
            refresh();     // Refresh ton solde WPT
        } else {
            tg.showAlert(res.error || "Solde insuffisant !");
        }
    } catch (e) { tg.showAlert("Erreur de connexion casino."); }
}





// 1. VRAI PAIEMENT STARS
async function buyStarsPack(amount) {
    try {
        // Appelle ton API Python qui génère le lien de facture Telegram
        const r = await fetch(`${BASE_URL}/api/stars/create-invoice`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: uid, stars: amount })
        });
        const d = await r.json();
        
        if (d.link) {
            // Ouvre l'interface de paiement OFFICIELLE de Telegram
            tg.openInvoice(d.link, (status) => {
                if (status === 'paid') {
                    tg.showAlert("✅ Merci Boss ! WPT crédités.");
                    refresh(); // Recharge le solde immédiatement
                }
            });
        } else {
            tg.showAlert("Erreur: " + (d.error || "Lien de paiement indisponible"));
        }
    } catch (e) {
        console.error("Stars Error:", e);
        tg.showAlert("Impossible de contacter le serveur de paiement.");
    }
}

// 2. VRAIE CONNEXION WALLET (Si tu utilises ton-connect)
function connectTonWallet() {
    // Si tu as déjà injecté le script TonConnectUI dans ton base.html :
    if (window.tonConnectUI) {
        window.tonConnectUI.openModal();
    } else {
        // Si tu n'as pas encore le SDK, on redirige vers ta fonction de sauvegarde manuelle
        showPage('p-profil'); 
        tg.showAlert("Ouvre le profil pour lier ton adresse UQ... manuellement !");
    }
}







async function loadLeaderboard() {
    try {
        const r = await fetch(`${BASE_URL}/api/leaderboard`);
        const data = await r.json();
        const container = document.getElementById('leaderboard');
        
        container.innerHTML = data.map((user, index) => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:15px; border-bottom:1px solid #111; ${user.id == uid ? 'background:rgba(255,215,0,0.1);' : ''}">
                <span style="font-size:14px;">#${index + 1} ${user.username}</span>
                <b style="color:var(--gold); font-family:monospace;">${parseFloat(user.score).toLocaleString()}</b>
            </div>
        `).join('');
    } catch (e) { console.error("Leaderboard error", e); }
}

</script>
