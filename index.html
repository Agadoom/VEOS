<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WPT Hub - Ecosystem</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>

        :root { 
            --bg: #050505; --card: #121214; --gold: #FFD700; 
            --blue: #007AFF; --green: #34C759; --purple: #A259FF; 
            --red: #eb4034; --text: #8E8E8E; 
        }
        body { background: var(--bg); color: #FFF; font-family: -apple-system, sans-serif; margin: 0; padding: 0; overflow: hidden; }
    
        /* Ticker Animation */
        .ticker { background: #1a1a1c; padding: 8px 0; border-bottom: 1px solid #333; overflow: hidden; white-space: nowrap; font-size: 11px; }
        .t-wrap { display: inline-block; animation: scroll 20s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        /* Layout */
        .container { padding: 15px; padding-bottom: 110px; height: 90vh; overflow-y: auto; }
        .prof-header { background: linear-gradient(135deg, #1c1c1e 0%, #050505 100%); border-radius: 30px; padding: 25px 20px; border: 1px solid #222; margin-bottom: 20px; text-align: center; }
        
        /* Cards & Buttons */
        .card { background: var(--card); border-radius: 20px; padding: 15px; margin-bottom: 12px; border: 1px solid #1c1c1e; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #FFF; color: #000; border: none; padding: 12px 20px; border-radius: 14px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
        
        /* Navigation */
        .nav { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(15,15,15,0.95); backdrop-filter: blur(15px); padding: 12px 35px; border-radius: 50px; display: flex; gap: 40px; border: 1px solid #333; z-index: 999; }
        .n-i { font-size: 24px; opacity: 0.3; transition: 0.3s; cursor:pointer; }
        .n-i.active { opacity: 1; color: var(--gold); transform: scale(1.1); }
        
        /* Form Inputs */
        .l-input { background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 12px; width: 100%; box-sizing: border-box; margin-bottom: 8px; }
        
        .page { display: none; }
        .active-page { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Chart container */
        .chart-container { padding: 10px; background: #000; border-radius: 15px; border: 1px solid #222; margin: 10px; }
    </style>
</head>
<body>
    <div class="ticker"><div class="t-wrap"><span style="color:var(--gold)">🏆 NETWORK ACTIVE ● TRADING ENABLED ● MINE TO EARN ● </span></div></div>

    <div class="container">
        
        <div id="p-mine" class="page active-page">
            <div class="prof-header">
                <small id="u-badge" style="color:var(--gold); font-weight:bold;">RANK: NOVICE</small>
                <h1 id="tot" style="font-size:45px; margin:10px 0;">0.00</h1>
                <div style="background:#222; height:6px; border-radius:10px; margin:10px 0;"><div id="e-f" style="background:var(--gold); height:100%; width:0%; transition:0.3s;"></div></div>
                <small id="e-t" style="color:var(--text)">Energy: 0/100</small>
            </div>
            <div class="card"><div><b>Genesis (WPT)</b><br><small id="gv">0.00</small></div><button class="btn" onclick="mine('genesis')">MINE</button></div>
            <div class="card"><div><b>Unity</b><br><small id="uv">0.00</small></div><button class="btn" onclick="mine('unity')">SYNC</button></div>
            <div class="card"><div><b style="color:var(--purple)">Veo AI</b><br><small id="vv">0.00</small></div><button class="btn" style="background:var(--purple); color:#fff;" onclick="mine('veo')">COMPUTE</button></div>
        </div>

        <div id="p-launcher" class="page">
            <h2 style="text-align:center;">🚀 LAUNCHPAD</h2>
            <div class="card" style="flex-direction:column; align-items:stretch; gap:10px; background:#000;">
                <input type="text" id="tk-name" class="l-input" placeholder="Token Name">
                <input type="text" id="tk-sym" class="l-input" placeholder="$SYMBOL">
                <textarea id="tk-desc" class="l-input" placeholder="Description..."></textarea>
                <div style="display:flex; gap:10px;">
                    <label class="btn" style="flex:1; background:#222; color:#fff; font-size:11px; text-align:center;">LOGO<input type="file" id="f-logo" hidden onchange="processFile('logo')"></label>
                    <label class="btn" style="flex:1; background:#222; color:#fff; font-size:11px; text-align:center;">BANNER<input type="file" id="f-banner" hidden onchange="processFile('banner')"></label>
                </div>
                <button class="btn" style="background:var(--gold);" onclick="deployToken()">LAUNCH (10 ★)</button>
            </div>
            <h3 style="margin-top:20px;">🔥 LIVE MARKET</h3>
            <div id="token-list"></div>
        </div>

<script>
    const tg = window.Telegram.WebApp;
    const uid = tg.initDataUnsafe.user?.id || 0;
    const BASE_URL = 'https://veos-production-a2de.up.railway.app';
    
    let b64_logo = "", b64_banner = "";

    function show(p) {
        document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active-page'));
        document.getElementById('p-' + p).classList.add('active-page');
        document.querySelectorAll('.n-i').forEach(ni => ni.classList.remove('active'));
        document.getElementById('n-' + (p === 'details' ? 'launcher' : p)).classList.add('active');
        if(p === 'launcher') loadMarket();
        if(p === 'profil') loadLeaderboard();
        refresh();
    }

    async function refresh() {
        try {
            const r = await fetch(`${BASE_URL}/api/user/${uid}`);
            const d = await r.json();
            document.getElementById('tot').innerText = d.score.toFixed(2);
            document.getElementById('gv').innerText = d.g.toFixed(2);
            document.getElementById('uv').innerText = d.u.toFixed(2);
            document.getElementById('vv').innerText = d.v.toFixed(2);
            document.getElementById('wallet-balance').innerText = d.score.toFixed(2);
            document.getElementById('prof-rank').innerText = "RANK #" + (d.rank || "---");
            document.getElementById('prof-name').innerText = d.name || "User";
            document.getElementById('prof-id').innerText = "UID: " + uid;
            document.getElementById('e-f').style.width = (d.energy/d.max_energy*100) + "%";
            document.getElementById('e-t').innerText = `Energy: ${Math.floor(d.energy)}/100`;
        } catch(e) { console.error("Refresh error"); }
    }

    async function mine(t) {
        const r = await fetch(`${BASE_URL}/api/mine`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({user_id:uid, token:t})
        });
        if(r.ok) { tg.HapticFeedback.impactOccurred('light'); refresh(); }
    }

    async function loadLeaderboard() {
        try {
            const r = await fetch(`${BASE_URL}/api/user/leaderboard`);
            const data = await r.json();
            let h = "";
            data.forEach(u => {
                h += `<div class="card"><span>#${u.rank} ${u.name}</span><b>${u.score.toFixed(2)}</b></div>`;
            });
            document.getElementById('leaderboard').innerHTML = h || "<center>No data</center>";
        } catch(e) {}
    }

    function processFile(t) {
        const f = document.getElementById('f-'+t).files[0];
        const reader = new FileReader();
        reader.onloadend = () => {
            if(t === 'logo') b64_logo = reader.result;
            else b64_banner = reader.result;
            tg.showAlert(t.toUpperCase() + " Loaded!");
        };
        reader.readAsDataURL(f);
    }

    async function deployToken() {
        const n = document.getElementById('tk-name').value;
        const s = document.getElementById('tk-sym').value;
        if(!n || !s || !b64_logo) return tg.showAlert("Missing Name or Logo");

        const res = await fetch(`${BASE_URL}/api/launcher/deploy`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                user_id:uid, name:n, symbol:s, 
                description:document.getElementById('tk-desc').value,
                logo_b64:b64_logo, banner_b64:b64_banner
            })
        });
        if(res.ok) { tg.showAlert("🚀 Token Deployed!"); show('launcher'); }
    }

    async function loadMarket() {
        const r = await fetch(`${BASE_URL}/api/launcher/list`);
        const tokens = await r.json();
        document.getElementById('token-list').innerHTML = tokens.map(t => `
            <div class="card">
                <div style="display:flex; align-items:center; gap:10px;">
                    <img src="${t.logo}" style="width:30px; height:30px; border-radius:5px; object-fit:cover;">
                    <b>${t.name}</b>
                </div>
                <b style="color:var(--green)">${t.price.toFixed(6)}</b>
            </div>
        `).join('');
    }

    function buyStarsPack() {
        fetch(`${BASE_URL}/api/stars/create-invoice/${uid}`).then(r=>r.json()).then(d=>{
            if(d.invoice_link) tg.openInvoice(d.invoice_link, s => { if(s==='paid') refresh(); });
        });
    }

    const connector = new TonConnectSDK.TonConnect({ manifestUrl: `${BASE_URL}/tonconnect-manifest.json` });
    connector.onStatusChange(w => {
        if(w) {
            document.getElementById('btn-connect').style.display = 'none';
            document.getElementById('wallet-addr').innerText = w.account.address;
        }
    });

    async function connectWallet() {
        const url = connector.connect({ universalLink: 'https://tonkeeper.com/ton-connect', bridgeUrl: 'https://bridge.tonapi.io/bridge' });
        if(url) tg.openTelegramLink(url);
    }

    function shareRef() {
        tg.openTelegramLink(`https://t.me/share/url?url=https://t.me/OWPCsBot?start=${uid}&text=Join%20the%20WPT%20Ecosystem!`);
    }

    tg.expand();
    refresh();
    setInterval(refresh, 8000);
</script>
</body>
</html>
