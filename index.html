<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WPT Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/sdk@latest/dist/tonconnect-sdk.min.js"></script>
    <style>
        :root { --bg: #050505; --card: #121214; --gold: #FFD700; --blue: #007AFF; --text: #8E8E8E; }
        body { background: var(--bg); color: #FFF; font-family: sans-serif; margin: 0; padding: 0; overflow: hidden; }
        .container { padding: 15px; padding-bottom: 100px; height: 100vh; overflow-y: auto; box-sizing: border-box; }
        .page { display: none; }
        .active-page { display: block; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .btn { background: #FFF; color: #000; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111; padding: 10px 30px; border-radius: 50px; display: flex; gap: 30px; border: 1px solid #333; z-index: 9999; }
        .n-i { font-size: 22px; opacity: 0.4; cursor: pointer; }
        .n-i.active { opacity: 1; color: var(--gold); }
        .l-input { background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 10px; width: 100%; margin-bottom: 10px; }
        .prof-header { text-align: center; padding: 20px; background: #111; border-radius: 20px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="p-mine" class="page active-page">
        <div class="prof-header">
            <h1 id="tot">0.00</h1>
            <div style="background:#222; height:5px; border-radius:5px;"><div id="e-f" style="background:var(--gold); width:0%; height:100%;"></div></div>
            <small id="e-t">Energy: 0/100</small>
        </div>
        <div class="card"><div><b>Genesis</b><br><small id="gv">0.00</small></div><button class="btn" onclick="mine('genesis')">MINE</button></div>
        <div class="card"><div><b>Unity</b><br><small id="uv">0.00</small></div><button class="btn" onclick="mine('unity')">SYNC</button></div>
    </div>

    <div id="p-launcher" class="page">
        <h2>🚀 Launch Token</h2>
        <div class="card" style="flex-direction:column; align-items:stretch;">
            <input type="text" id="tk-name" class="l-input" placeholder="Name">
            <input type="text" id="tk-sym" class="l-input" placeholder="$SYM">
            <button class="btn" style="background:var(--gold)" onclick="deployToken()">DEPLOY (5000 WPT)</button>
        </div>
        <h3>Market</h3>
        <div id="token-list"></div>
    </div>

    <div id="p-wallet" class="page">
        <h2>💼 Wallet</h2>
        <div class="card" style="text-align:center; flex-direction:column;">
            <small>Total WPT</small>
            <h2 id="wallet-genesis" style="color:var(--gold)">0.00</h2>
        </div>
        <button class="btn" style="width:100%; background:var(--blue); color:#fff;" onclick="connectWallet()">💎 CONNECT WALLET</button>
        <div id="wallet-zone" style="margin-top:10px; text-align:center;"></div>
    </div>

    <div id="p-profil" class="page">
        <div class="prof-header">
            <h2 id="prof-name">User</h2>
            <b id="prof-rank" style="color:var(--gold)">RANK #---</b>
        </div>
        <button class="btn" style="width:100%; background:var(--blue); color:#fff;" onclick="shareReferral()">INVITE FRIENDS</button>
        <div id="leaderboard-list" style="margin-top:20px;"></div>
    </div>
</div>

<nav class="nav">
    <div onclick="show('mine')" id="n-mine" class="n-i active">🏠</div>
    <div onclick="show('launcher')" id="n-launcher" class="n-i">🚀</div>
    <div onclick="show('wallet')" id="n-wallet" class="n-i">💼</div> 
    <div onclick="show('profil')" id="n-profil" class="n-i">👤</div>
</nav>

<script>
    const tg = window.Telegram.WebApp;
    const uid = tg.initDataUnsafe.user?.id || 0;
    const BASE_URL = 'https://veos-production-a2de.up.railway.app';
    
    // NAVIGATION
    function show(p) {
        console.log("Switching to page:", p);
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active-page'));
        document.getElementById('p-' + p).classList.add('active-page');
        
        document.querySelectorAll('.n-i').forEach(icon => icon.classList.remove('active'));
        document.getElementById('n-' + p).classList.add('active');
        
        if(p === 'launcher') loadMarket();
        refresh();
    }

    // DATA
    async function refresh() {
        try {
            const r = await fetch(`${BASE_URL}/api/user/${uid}`);
            const d = await r.json();
            document.getElementById('tot').innerText = d.score.toFixed(2);
            document.getElementById('gv').innerText = d.g.toFixed(2);
            document.getElementById('uv').innerText = d.u.toFixed(2);
            document.getElementById('wallet-genesis').innerText = d.score.toFixed(2);
            document.getElementById('prof-rank').innerText = "RANK #" + (d.rank || "---");
            document.getElementById('e-f').style.width = (d.energy/d.max_energy*100) + "%";
            document.getElementById('e-t').innerText = "Energy: " + Math.floor(d.energy) + "/100";
        } catch(e) { console.log("Refresh error"); }
    }

    // ACTIONS
    async function mine(type) {
        await fetch(`${BASE_URL}/api/mine`, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({user_id:uid, token:type})
        });
        tg.HapticFeedback.impactOccurred('light');
        refresh();
    }

    async function loadMarket() {
        const r = await fetch(`${BASE_URL}/api/launcher/list`);
        const tokens = await r.json();
        document.getElementById('token-list').innerHTML = tokens.map(t => `
            <div class="card"><b>${t.name}</b> <span>${t.price.toFixed(6)} WPT</span></div>
        `).join('');
    }

    function shareReferral() {
        const link = `https://t.me/OWPCsBot?start=${uid}`;
        tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=Join%20me!`);
    }

    tg.expand();
    refresh();
    setInterval(refresh, 8000);
</script>

</body>
</html>
